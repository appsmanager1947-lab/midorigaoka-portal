<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割変更 | 教職員用ポータルサイト</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
        .pair-row { background-color: #EBF5FB !important; }
        .sc-before { color: #c0392b; }
        .sc-after  { color: #1a5276; }
        .arrow-cell { text-align: center; color: #888; font-size: 18px; }
        #pair-section { display: none; margin-top: 16px; padding: 16px; background: #f0f8ff; border: 1px solid #AED6F1; border-radius: 6px; }
        #pair-section h4 { margin: 0 0 12px 0; color: #1a5276; font-size: 14px; }
        .readonly-input { background-color: #f5f5f5 !important; color: #888 !important; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./static/ロゴ緑.png" alt="学校ロゴ" style="width: 40px; height: 40px; object-fit: contain; margin-right: 12px;">
                <div class="header-text">
                    <span class="school-name">緑ヶ丘女子高等学校</span>
                    <h1 style="margin: 0; font-size: 18px;">教職員ポータル</h1>
                </div>
            </div>
            <div class="sidebar-section"><h2 class="sidebar-title">ショートカット</h2><ul class="app-list"></ul></div>
        </aside>

        <main class="main-content">
            <section class="column-section" style="margin-top: 0; margin-bottom: 40px;">
                <div class="column-header">
                    <h2 class="section-title">時間割変更</h2>
                    <button id="sc-add-btn" class="add-button">＋ 新規</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="active-table" style="min-width: 900px;">
                        <thead>
                            <tr>
                                <th>日付</th>
                                <th>曜日・時限</th>
                                <th>対象クラス</th>
                                <th>変更前（科目／担当）</th>
                                <th class="arrow-cell">→</th>
                                <th>変更後（科目／担当）</th>
                                <th>備考</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="sc-table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- モーダル -->
    <div id="sc-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 560px; width: 100%;">
            <h3 class="modal-title">時間割変更を追加</h3>

            <!-- メイン行 -->
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label>日付</label>
                    <input type="date" id="sc-date" class="modal-input">
                </div>
                <div class="form-group" style="flex: 0 0 70px;">
                    <label>曜日</label>
                    <input type="text" id="sc-dow" class="modal-input readonly-input" readonly>
                </div>
                <div class="form-group" style="flex: 0 0 80px;">
                    <label>時限</label>
                    <select id="sc-period" class="modal-input" style="background-color:#fff; cursor:pointer;">
                        <option value="1">1h</option><option value="2">2h</option><option value="3">3h</option>
                        <option value="4">4h</option><option value="5">5h</option><option value="6">6h</option>
                        <option value="7">7h</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>対象クラス</label>
                <select id="sc-class" class="modal-input" style="background-color:#fff; cursor:pointer;">
                    <option value="1-1">1-1</option><option value="1-2">1-2</option>
                    <option value="1-3">1-3</option><option value="1-4">1-4</option>
                    <option value="2-1">2-1</option><option value="2-2">2-2</option>
                    <option value="2-3">2-3</option><option value="2-4">2-4</option>
                    <option value="3-1">3-1</option><option value="3-2">3-2</option>
                    <option value="3-3">3-3</option><option value="3-4">3-4</option>
                    <option value="3-A">3-A</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label>変更前 科目</label>
                    <input type="text" id="sc-before-subject" class="modal-input" placeholder="例：現代文">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>変更前 担当</label>
                    <input type="text" id="sc-before-teacher" class="modal-input" placeholder="例：山田">
                </div>
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label>変更後 科目</label>
                    <input type="text" id="sc-after-subject" class="modal-input" placeholder="例：英語">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>変更後 担当</label>
                    <input type="text" id="sc-after-teacher" class="modal-input" placeholder="例：田中">
                </div>
            </div>
            <div class="form-group">
                <label>備考</label>
                <input type="text" id="sc-note" class="modal-input" placeholder="任意">
            </div>

            <!-- 授業交換チェックボックス -->
            <div style="margin: 8px 0 4px 0;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="sc-is-swap" style="width:16px; height:16px;">
                    授業交換（別日との入れ替え）
                </label>
            </div>

            <!-- 交換相手セクション -->
            <div id="pair-section">
                <h4>交換相手の情報</h4>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>日付</label>
                        <input type="date" id="sc-pair-date" class="modal-input">
                    </div>
                    <div class="form-group" style="flex: 0 0 70px;">
                        <label>曜日</label>
                        <input type="text" id="sc-pair-dow" class="modal-input readonly-input" readonly>
                    </div>
                    <div class="form-group" style="flex: 0 0 80px;">
                        <label>時限</label>
                        <select id="sc-pair-period" class="modal-input" style="background-color:#fff; cursor:pointer;">
                            <option value="1">1h</option><option value="2">2h</option><option value="3">3h</option>
                            <option value="4">4h</option><option value="5">5h</option><option value="6">6h</option>
                            <option value="7">7h</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label id="sc-pair-class-label">対象クラス（自動）</label>
                    <select id="sc-pair-class" class="modal-input readonly-input" disabled style="cursor:not-allowed;">
                        <option value="1-1">1-1</option><option value="1-2">1-2</option>
                        <option value="1-3">1-3</option><option value="1-4">1-4</option>
                        <option value="2-1">2-1</option><option value="2-2">2-2</option>
                        <option value="2-3">2-3</option><option value="2-4">2-4</option>
                        <option value="3-1">3-1</option><option value="3-2">3-2</option>
                        <option value="3-3">3-3</option><option value="3-4">3-4</option>
                        <option value="3-A">3-A</option>
                    </select>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>変更前 科目（自動）</label>
                        <input type="text" id="sc-pair-before-subject" class="modal-input readonly-input" readonly>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>変更前 担当（自動）</label>
                        <input type="text" id="sc-pair-before-teacher" class="modal-input readonly-input" readonly>
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>変更後 科目（自動）</label>
                        <input type="text" id="sc-pair-after-subject" class="modal-input readonly-input" readonly>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>変更後 担当（自動）</label>
                        <input type="text" id="sc-pair-after-teacher" class="modal-input readonly-input" readonly>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button id="sc-cancel" class="btn-cancel">キャンセル</button>
                <button id="sc-submit" class="btn-submit">追加</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="./static/js/firebase_init.js"></script>
    <script src="./static/js/ui_common.js"></script>
    <script src="./static/js/portal_features.js"></script>
    <script src="./static/js/portal_editor.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const DAYS = ['日','月','火','水','木','金','土'];

        function calcDow(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return DAYS[d.getDay()];
        }

        // --- 日付→曜日の自動入力 ---
        document.getElementById('sc-date').addEventListener('change', function() {
            document.getElementById('sc-dow').value = calcDow(this.value);
        });
        document.getElementById('sc-pair-date').addEventListener('change', function() {
            document.getElementById('sc-pair-dow').value = calcDow(this.value);
        });

        // --- 交換相手の科目・担当・クラスを自動追従 ---
        function syncPairFields() {
            document.getElementById('sc-pair-before-subject').value = document.getElementById('sc-after-subject').value;
            document.getElementById('sc-pair-before-teacher').value = document.getElementById('sc-after-teacher').value;
            document.getElementById('sc-pair-after-subject').value  = document.getElementById('sc-before-subject').value;
            document.getElementById('sc-pair-after-teacher').value  = document.getElementById('sc-before-teacher').value;
        }
        function syncPairClass() {
            document.getElementById('sc-pair-class').value = document.getElementById('sc-class').value;
        }
        ['sc-before-subject','sc-before-teacher','sc-after-subject','sc-after-teacher'].forEach(id => {
            document.getElementById(id).addEventListener('input', syncPairFields);
        });
        // メインのクラスが変わったら交換相手のクラスも追従
        document.getElementById('sc-class').addEventListener('change', function() {
            if (document.getElementById('sc-is-swap').checked) syncPairClass();
        });

        // --- 授業交換チェックボックス ---
        document.getElementById('sc-is-swap').addEventListener('change', function() {
            document.getElementById('pair-section').style.display = this.checked ? 'block' : 'none';
            if (this.checked) {
                syncPairFields();
                syncPairClass();
            }
        });

        // --- テーブル描画 ---
        function renderTable(docs) {
            const tbody = document.getElementById('sc-table-body');
            tbody.innerHTML = '';
            if (docs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#aaa; padding:24px;">データがありません</td></tr>';
                return;
            }
            docs.forEach(doc => {
                const d = doc.data();
                const tr = document.createElement('tr');
                if (d.pairId) tr.classList.add('pair-row');

                tr.innerHTML = `
                    <td>${d.date || ''}</td>
                    <td>${d.dayOfWeek || ''}曜 ${d.period || ''}限</td>
                    <td>${d.targetClass || ''}</td>
                    <td class="sc-before">${d.beforeSubject || ''}<br><small>${d.beforeTeacher || ''}</small></td>
                    <td class="arrow-cell">→</td>
                    <td class="sc-after">${d.afterSubject || ''}<br><small>${d.afterTeacher || ''}</small></td>
                    <td>${d.note || ''}</td>
                    <td>
                        <button class="sc-delete-btn" data-id="${doc.id}" data-pair="${d.pairId || ''}"
                            style="background:transparent; color:#d9534f; border:none; font-size:16px; cursor:pointer; font-weight:bold;">×</button>
                    </td>`;
                tbody.appendChild(tr);
            });

            // 削除ボタン
            tbody.querySelectorAll('.sc-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const docId  = btn.dataset.id;
                    const pairId = btn.dataset.pair;

                    if (pairId) {
                        const choice = confirm('交換相手の行も同時に削除しますか？\n[OK] → 2件まとめて削除\n[キャンセル] → この1件のみ削除');
                        if (choice) {
                            // pairIdが一致する全件をバッチ削除
                            db.collection('schedule_changes').where('pairId', '==', pairId).get().then(snap => {
                                const batch = db.batch();
                                snap.forEach(d => batch.delete(db.collection('schedule_changes').doc(d.id)));
                                return batch.commit();
                            });
                        } else {
                            if (confirm('この1件を削除しますか？')) {
                                db.collection('schedule_changes').doc(docId).delete();
                            }
                        }
                    } else {
                        if (confirm('このデータを削除しますか？')) {
                            db.collection('schedule_changes').doc(docId).delete();
                        }
                    }
                });
            });
        }

        // --- Firestore リアルタイム取得 ---
        setTimeout(() => {
            if (typeof db !== 'undefined') {
                db.collection('schedule_changes')
                  .orderBy('date', 'asc')
                  .onSnapshot(snap => {
                      renderTable(snap.docs);
                  });
            }
        }, 500);

        // --- モーダル開閉 ---
        const modal = document.getElementById('sc-modal');

        document.getElementById('sc-add-btn').addEventListener('click', () => {
            // フォームリセット
            ['sc-date','sc-dow','sc-note','sc-pair-date','sc-pair-dow',
             'sc-before-subject','sc-before-teacher','sc-after-subject','sc-after-teacher',
             'sc-pair-before-subject','sc-pair-before-teacher','sc-pair-after-subject','sc-pair-after-teacher'
            ].forEach(id => document.getElementById(id).value = '');
            document.getElementById('sc-period').value = '1';
            document.getElementById('sc-class').value  = '1-1';
            document.getElementById('sc-pair-period').value = '1';
            document.getElementById('sc-pair-class').value  = '1-1';
            document.getElementById('sc-is-swap').checked = false;
            document.getElementById('pair-section').style.display = 'none';
            document.getElementById('sc-submit').textContent = '追加';
            modal.classList.remove('hidden');
        });

        document.getElementById('sc-cancel').addEventListener('click', () => modal.classList.add('hidden'));

        // --- 保存 ---
        document.getElementById('sc-submit').addEventListener('click', () => {
            const date          = document.getElementById('sc-date').value;
            const dayOfWeek     = document.getElementById('sc-dow').value;
            const period        = document.getElementById('sc-period').value;
            const targetClass   = document.getElementById('sc-class').value;
            const beforeSubject = document.getElementById('sc-before-subject').value.trim();
            const beforeTeacher = document.getElementById('sc-before-teacher').value.trim();
            const afterSubject  = document.getElementById('sc-after-subject').value.trim();
            const afterTeacher  = document.getElementById('sc-after-teacher').value.trim();
            const note          = document.getElementById('sc-note').value.trim();
            const isSwap        = document.getElementById('sc-is-swap').checked;

            if (!date || !beforeSubject || !afterSubject) {
                alert('日付・変更前科目・変更後科目は必須です。');
                return;
            }

            const submitBtn = document.getElementById('sc-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = '保存中...';

            const col = db.collection('schedule_changes');

            if (isSwap) {
                const pairDate    = document.getElementById('sc-pair-date').value;
                const pairDow     = document.getElementById('sc-pair-dow').value;
                const pairPeriod  = document.getElementById('sc-pair-period').value;
                const pairClass   = document.getElementById('sc-pair-class').value;

                if (!pairDate) {
                    alert('交換相手の日付を入力してください。');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '追加';
                    return;
                }

                // UUID生成（crypto.randomUUID があれば使う）
                const pairId = (typeof crypto !== 'undefined' && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : (Date.now().toString(36) + Math.random().toString(36).slice(2));

                const batch = db.batch();
                const ref1  = col.doc();
                const ref2  = col.doc();

                batch.set(ref1, {
                    date, dayOfWeek, period, targetClass,
                    beforeSubject, beforeTeacher, afterSubject, afterTeacher,
                    note, pairId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                batch.set(ref2, {
                    date: pairDate, dayOfWeek: pairDow, period: pairPeriod, targetClass: pairClass,
                    beforeSubject: afterSubject, beforeTeacher: afterTeacher,
                    afterSubject: beforeSubject, afterTeacher: beforeTeacher,
                    note, pairId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                batch.commit().then(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '追加';
                    modal.classList.add('hidden');
                }).catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'エラー';
                });

            } else {
                col.add({
                    date, dayOfWeek, period, targetClass,
                    beforeSubject, beforeTeacher, afterSubject, afterTeacher,
                    note, pairId: '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '追加';
                    modal.classList.add('hidden');
                }).catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'エラー';
                });
            }
        });
    });
    </script>
</body>
</html>
