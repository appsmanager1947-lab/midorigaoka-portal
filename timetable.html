<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>各クラス時間割 | 教職員用ポータルサイト</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
        /* 時間割特有のスタイル */
        .timetable-table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1000px; }
        .timetable-table th, .timetable-table td { border: 1px solid #E6E4DF; padding: 8px; text-align: left; vertical-align: top; }
        .timetable-table th { background-color: #F7F7F5; text-align: center; font-weight: bold; color: #4A4643; }
        .tt-day-col { width: 50px; text-align: center !important; vertical-align: middle !important; background-color: #F7F7F5; }
        .tt-cell { min-height: 80px; }
        /* タグのデザイン */
        /* タグのデザイン */
        .tt-tag { 
            display: block; /* ★ココを変更：必ず縦に並ぶようになります */
            background: #fff; border: 1px solid #ddd; border-radius: 4px; 
            padding: 4px 6px; margin: 4px 2px; /* 上下に少し余白をとって見やすくしました */
            font-size: 11px; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: relative;
        }
        .tt-class { font-weight: bold; color: #2c6e49; margin-right: 4px; }
        .tt-teacher { color: #666; font-size: 10px; }
        .delete-tt-btn {
            position: absolute; top: -6px; right: -6px; background: #d9534f; color: #fff; 
            border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; 
            line-height: 1; cursor: pointer; display: none; align-items: center; justify-content: center;
        }
        .edit-mode .delete-tt-btn { display: flex; }
        .edit-mode .tt-tag { border-color: #d9534f; }
    </style>
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./static/ロゴ緑.png" alt="学校ロゴ" style="width: 40px; height: 40px; object-fit: contain; margin-right: 12px;">
                <div class="header-text">
                    <span class="school-name">緑ヶ丘女子高等学校</span>
                    <h1 style="margin: 0; font-size: 18px;">教職員ポータル</h1>
                </div>
            </div>
            <div class="sidebar-section"><h2 class="sidebar-title">ショートカット</h2><ul class="app-list"></ul></div>
        </aside>

        <main class="main-content">
            <section class="column-section" style="margin-top: 0; margin-bottom: 40px;">
                <div class="column-header">
                    <h2 class="section-title">各クラス時間割</h2>
                    <button id="edit-tt-btn" class="btn-cancel" style="margin-right: 8px;">⚙️ 設定 (追加/削除)</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="timetable-table">
                        <thead>
                            <tr>
                                <th class="tt-day-col"></th>
                                <th>1h</th><th>2h</th><th>3h</th><th>4h</th><th>5h</th><th>6h</th><th>7h</th>
                            </tr>
                        </thead>
                        <tbody id="timetable-body">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="tt-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="modal-title">時間割を追加</h3>
            <div style="display: flex; gap: 16px;">
                <div class="form-group" style="flex: 1;">
                    <label>曜日</label>
                    <select id="tt-day" class="modal-input" style="background-color: #fff; cursor: pointer;">
                        <option value="月">月</option><option value="火">火</option><option value="水">水</option><option value="木">木</option><option value="金">金</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>時限</label>
                    <select id="tt-period" class="modal-input" style="background-color: #fff; cursor: pointer;">
                        <option value="1">1h</option><option value="2">2h</option><option value="3">3h</option><option value="4">4h</option><option value="5">5h</option><option value="6">6h</option><option value="7">7h</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>クラス</label>
                <select id="tt-class" class="modal-input" style="background-color: #fff; cursor: pointer;">
                    <option value="1-1">1-1</option><option value="1-2">1-2</option><option value="1-3">1-3</option><option value="1-4">1-4</option>
                    <option value="2-1">2-1</option><option value="2-2">2-2</option><option value="2-3">2-3</option><option value="2-4">2-4</option>
                    <option value="3-1">3-1</option><option value="3-2">3-2</option><option value="3-3">3-3</option><option value="3-4">3-4</option>
                    <option value="3-A">3-A</option>
                </select>
            </div>
            <div class="form-group"><label>科目名</label><input type="text" id="tt-subject" class="modal-input" placeholder="例：現代文、英語など"></div>
            <div class="form-group"><label>担当者</label><input type="text" id="tt-teacher" class="modal-input" placeholder="例：山田"></div>
            <div class="modal-actions"><button id="tt-cancel" class="btn-cancel">キャンセル</button><button id="tt-submit" class="btn-submit">追加</button></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <script src="./static/js/firebase_init.js"></script>
    <script src="./static/js/ui_common.js"></script>
    <script src="./static/js/portal_features.js"></script>
    <script src="./static/js/portal_editor.js"></script>
</body>
</html>
