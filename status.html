<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務・出張・来客状況 | 教職員用ポータルサイト</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./static/ロゴ緑.png" alt="学校ロゴ" style="width: 40px; height: 40px; object-fit: contain; margin-right: 12px;">
                <div class="header-text">
                    <span class="school-name">緑ヶ丘女子高等学校</span>
                    <h1 style="margin: 0; font-size: 18px;">教職員ポータル</h1>
                </div>
            </div>
            <div class="sidebar-section"><h2 class="sidebar-title">ショートカット</h2><ul class="app-list"></ul></div>
        </aside>

        <main class="main-content">
            <div class="date-controller">
                <button id="status-prev-btn" class="date-btn">◀ 前の日</button>
                <input type="date" id="status-view-date" class="modal-input" style="width: auto; margin: 0; font-weight: bold; font-size: 16px;">
                <button id="status-next-btn" class="date-btn">次の日 ▶</button>
                <button id="status-today-btn" class="date-btn" style="background-color: #fce4e4; color: #d9534f; border-color: #f5c6c6;">今日に戻る</button>
            </div>

            <section class="column-section" style="margin-top: 0; margin-bottom: 40px;">
                <div class="column-header"><h2 class="section-title" id="att-section-title">本日の出勤状況</h2><button id="add-att-btn" class="add-button">＋ 追加</button></div>
                <div style="overflow-x: auto;"><table class="active-table">
                    <thead><tr><th>名前</th><th>種類</th><th>出勤予定</th><th>退勤予定</th><th>備考</th><th>操作</th></tr></thead>
                    <tbody id="attendance-body"></tbody>
                </table></div>
            </section>

            <section class="column-section" style="margin-top: 0; margin-bottom: 40px;">
                <div class="column-header"><h2 class="section-title" id="vis-section-title">本日の来客状況</h2><button id="add-vis-btn" class="add-button">＋ 追加</button></div>
                <div style="overflow-x: auto;"><table class="active-table">
                    <thead><tr><th>来客所属</th><th>人数</th><th>代表者名</th><th>内容</th><th>対応者</th><th>場所</th><th>来校予定</th><th>備考</th><th>操作</th></tr></thead>
                    <tbody id="visitor-body"></tbody>
                </table></div>
            </section>

            <section class="column-section" style="margin-top: 0; margin-bottom: 40px;">
                <div class="column-header"><h2 class="section-title" id="trip-section-title">本日の出張状況</h2><button id="add-trip-btn" class="add-button">＋ 追加</button></div>
                <div style="overflow-x: auto;"><table class="active-table">
                    <thead><tr><th>名前</th><th>内容</th><th>場所</th><th>出発時間</th><th>備考</th><th>操作</th></tr></thead>
                    <tbody id="trip-body"></tbody>
                </table></div>
            </section>
        </main>
    </div>

    <div id="att-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="modal-title" id="att-modal-title">出勤状況を追加</h3>
            <div class="form-group"><label>対象日</label><input type="date" id="att-date" class="modal-input"></div>
            <div class="form-group"><label>名前</label><input type="text" id="att-name" class="modal-input" placeholder="例：山田太郎"></div>
            <div class="form-group"><label>種類</label>
                <select id="att-type" class="modal-input" style="background-color: #fff; cursor: pointer;">
                    <option value="有給">有給</option><option value="時間給">時間給</option><option value="振休（一日）">振休（一日）</option><option value="振休（午前）">振休（午前）</option><option value="振休（午後）">振休（午後）</option>
                    <option value="遅刻">遅刻</option><option value="早退">早退</option><option value="調整">調整</option><option value="勤務免除">勤務免除</option><option value="欠勤">欠勤</option><option value="その他">その他</option>
                </select>
            </div>
            <div class="form-group" id="att-other-wrap" style="display:none;"><label>種類（自由記述）</label><input type="text" id="att-other-text" class="modal-input" placeholder="例：特別休暇"></div>
            <div style="display: flex; gap: 16px;">
                <div class="form-group" style="flex: 1;"><label>出勤予定時間</label><input type="time" id="att-start" class="modal-input"></div>
                <div class="form-group" style="flex: 1;"><label>退勤予定時間</label><input type="time" id="att-end" class="modal-input"></div>
            </div>
            <div class="form-group"><label>備考</label><textarea id="att-note" class="modal-input" rows="3" style="resize: vertical;" placeholder="改行して入力できます"></textarea></div>
            <div class="modal-actions"><button id="att-cancel" class="btn-cancel">キャンセル</button><button id="att-submit" class="btn-submit">追加</button></div>
        </div>
    </div>

    <div id="vis-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="modal-title" id="vis-modal-title">来客状況を追加</h3>
            <div class="form-group"><label>対象日</label><input type="date" id="vis-date" class="modal-input"></div>
            <div class="form-group"><label>来客所属</label><input type="text" id="vis-org" class="modal-input" placeholder="例：〇〇株式会社"></div>
            <div style="display: flex; gap: 16px;">
                <div class="form-group" style="flex: 1;"><label>人数</label><input type="text" id="vis-count" class="modal-input" placeholder="例：2名"></div>
                <div class="form-group" style="flex: 2;"><label>代表者名</label><input type="text" id="vis-rep" class="modal-input" placeholder="例：佐藤様"></div>
            </div>
            <div class="form-group"><label>内容</label><input type="text" id="vis-purpose" class="modal-input" placeholder="例：教材の打ち合わせ"></div>
            <div class="form-group"><label>対応者</label><input type="text" id="vis-host" class="modal-input" placeholder="例：山田太郎"></div>
            <div class="form-group"><label>場所</label>
                <input type="text" id="vis-loc" class="modal-input" list="vis-loc-options" placeholder="選択または入力してください">
                <datalist id="vis-loc-options">
                    <option value="ＡＢ会議室"></option><option value="Ａ応接室"></option><option value="Ｂ応接室"></option><option value="進路指導室"></option>
                    <option value="生徒会室"></option><option value="事務室"></option><option value="校長室"></option><option value="理事長室"></option>
                </datalist>
            </div>
            <div class="form-group"><label>来校予定時間</label><input type="time" id="vis-time" class="modal-input"></div>
            <div class="form-group"><label>備考</label><textarea id="vis-note" class="modal-input" rows="3" style="resize: vertical;"></textarea></div>
            <div class="modal-actions"><button id="vis-cancel" class="btn-cancel">キャンセル</button><button id="vis-submit" class="btn-submit">追加</button></div>
        </div>
    </div>

    <div id="trip-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="modal-title" id="trip-modal-title">出張状況を追加</h3>
            <div class="form-group"><label>対象日</label><input type="date" id="trip-date" class="modal-input"></div>
            <div class="form-group"><label>名前</label><input type="text" id="trip-name" class="modal-input"></div>
            <div class="form-group"><label>内容</label><input type="text" id="trip-purpose" class="modal-input"></div>
            <div class="form-group"><label>場所</label><input type="text" id="trip-loc" class="modal-input"></div>
            <div class="form-group"><label>出発時間</label><input type="time" id="trip-time" class="modal-input"></div>
            <div class="form-group"><label>備考</label><textarea id="trip-note" class="modal-input" rows="3" style="resize: vertical;"></textarea></div>
            <div class="modal-actions"><button id="trip-cancel" class="btn-cancel">キャンセル</button><button id="trip-submit" class="btn-submit">追加</button></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script src="./static/js/firebase_init.js"></script>
    <script src="./static/js/ui_common.js"></script>
    <script src="./static/js/portal_features.js"></script>
    <script src="./static/js/portal_editor.js"></script>
</body>
</html>
