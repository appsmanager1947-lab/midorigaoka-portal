<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共有掲示板 | 教職員用ポータルサイト</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./static/ロゴ緑.png" alt="学校ロゴ" style="width: 40px; height: 40px; object-fit: contain; margin-right: 12px;">
                <div class="header-text">
                    <span class="school-name">緑ヶ丘女子高等学校</span>
                    <h1 style="margin: 0; font-size: 18px;">教職員ポータル</h1>
                </div>
            </div>
            <div class="sidebar-section">
                <h2 class="sidebar-title">ショートカット</h2>
                <ul class="app-list"></ul>
            </div>
        </aside>

        <main class="main-content">
            <section class="column-section" style="margin-top: 0; margin-bottom: 40px;">
                <div class="column-header">
                    <h2 class="section-title">共有掲示板</h2>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button id="edit-boards-btn" style="background:transparent;border:none;cursor:pointer;font-size:14px;color:#aaa;text-decoration:underline;padding:4px 8px;">編集</button>
                        <button id="add-boards-btn" class="add-button" style="display:none;">＋ 追加</button>
                    </div>
                </div>
                <div id="boards-grid"></div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="./static/js/firebase_init.js"></script>
    <script src="./static/js/ui_common.js"></script>
    <script src="./static/js/portal_features.js"></script>
</body>
</html>
