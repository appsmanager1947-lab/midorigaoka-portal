<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="./static/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="緑高ポータル">
    <title>会議室等予約 | 教職員用ポータルサイト</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
        /* このページ専用オーバーライド */
        .main-content {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px 20px 0;
        }

        /* ページヘッダー */
        .res-page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .res-page-header h2 {
            white-space: nowrap;
            flex-shrink: 0;
        }
        .week-nav {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .week-nav-btn {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-main);
            font-family: inherit;
            white-space: nowrap;
        }
        .week-nav-btn:hover { background: var(--hover-bg); }
        #week-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            text-align: center;
        }
        #today-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            color: var(--accent-color);
            font-family: inherit;
            white-space: nowrap;
        }
        #today-btn:hover { background: #E8F4F3; }

        /* タブ */
        .tab-bar {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .tab-btn {
            padding: 8px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-family: inherit;
        }
        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* 凡例 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text-main);
        }
        .legend-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* タイムラインラッパー（スクロール領域） */
        .timeline-wrap {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .timeline-inner {
            min-width: calc(50px + 6 * 140px);
        }

        /* スティッキー曜日ヘッダー */
        .timeline-header {
            display: flex;
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
            border-bottom: 2px solid var(--border-color);
        }
        .tl-gutter {
            width: 50px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
        }
        .day-header-cell {
            flex: 1;
            min-width: 140px;
            padding: 8px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            border-left: 1px solid var(--border-color);
        }
        .day-header-cell.today-col {
            color: var(--accent-color);
            background: #F0F7F4;
        }

        /* タイムライン本体 */
        .timeline-body {
            display: flex;
            height: 1120px;
        }

        /* 時間ラベル列 */
        .time-col {
            width: 50px;
            flex-shrink: 0;
            position: relative;
            border-right: 1px solid var(--border-color);
        }
        .time-label {
            position: absolute;
            right: 6px;
            font-size: 11px;
            color: #999;
            transform: translateY(-50%);
            white-space: nowrap;
            pointer-events: none;
        }

        /* 曜日列 */
        .day-col {
            flex: 1;
            min-width: 140px;
            position: relative;
            border-left: 1px solid var(--border-color);
            cursor: pointer;
        }
        .day-col.today-col {
            background-color: #F0F7F4;
        }

        /* グリッド線 */
        .grid-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            pointer-events: none;
        }
        .grid-line.hour { border-top: 1px solid #ccc; }
        .grid-line.half { border-top: 1px dashed #e0e0e0; }

        /* 予約ブロック */
        .res-block {
            position: absolute;
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 11px;
            overflow: hidden;
            cursor: grab;
            box-sizing: border-box;
            z-index: 2;
            user-select: none;
        }
        .res-block.dragging { opacity: 0.25; cursor: grabbing; }
        .drag-ghost { cursor: grabbing !important; border-radius: 4px; overflow: hidden; }
        .res-block-location {
            font-size: 10px;
            opacity: 0.75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .res-block-purpose {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .res-block-user {
            font-size: 10px;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .res-block-time {
            font-size: 10px;
            opacity: 0.75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        /* デフォルト使用ブロック */
        .default-block {
            position: absolute;
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 11px;
            overflow: hidden;
            box-sizing: border-box;
            z-index: 1;
            opacity: 0.45;
            cursor: default;
            border-style: dashed;
            border-width: 2px;
        }
        .default-block-purpose {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .default-block-location {
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CSVモーダル */
        #csv-default-modal .modal-content { max-width: 640px; width: 96vw; }
        #csv-default-preview { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
        #csv-default-preview th, #csv-default-preview td { border:1px solid #E6E4DF; padding:4px 8px; }
        #csv-default-preview th { background:#F7F7F5; }

        /* 現在時刻ライン */
        .current-time-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(220, 53, 69, 0.8);
            z-index: 3;
            pointer-events: none;
        }

        /* 詳細ポップアップ */
        .detail-popup {
            position: fixed;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 20px;
            min-width: 220px;
            max-width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 500;
        }
        .detail-popup h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
            padding-right: 20px;
        }
        .detail-row {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .detail-row span {
            color: var(--text-main);
            font-weight: 500;
        }
        .detail-popup-close {
            position: absolute;
            top: 10px;
            right: 12px;
            cursor: pointer;
            font-size: 20px;
            color: #aaa;
            background: none;
            border: none;
            line-height: 1;
            padding: 0;
        }
        .detail-popup-close:hover { color: #666; }
    </style>
</head>

<script>
// ========== 場所マスタ ==========
const ROOM_LOCS = [
    { name: 'ＡＢ会議室', color: '#AED6F1' },
    { name: 'Ａ応接室',   color: '#A9DFBF' },
    { name: 'Ｂ応接室',   color: '#FAD7A0' },
    { name: '進路指導室', color: '#F1948A' },
    { name: '生徒会室',   color: '#C39BD3' },
];
const SPECIAL_LOCS = [
    { name: '視聴覚室',           color: '#76D7C4' },
    { name: '音楽室',             color: '#F7DC6F' },
    { name: '調理室',             color: '#85C1E9' },
    { name: '美術室',             color: '#82E0AA' },
    { name: '図書室',             color: '#F0B27A' },
    { name: 'ＰＣ教室',           color: '#AED6F1' },
    { name: '理科実験室',         color: '#A9DFBF' },
    { name: '体育室',             color: '#FAD7A0' },
    { name: '体育館',             color: '#F1948A' },
    { name: '学習室Ｓ',           color: '#C39BD3' },
    { name: 'ブラウジングルーム', color: '#76D7C4' },
    { name: 'エンジェルルーム',   color: '#85C1E9' },
    { name: '１１号教室',         color: '#82E0AA' },
    { name: '１２号教室',         color: '#F0B27A' },
    { name: '２２号教室',         color: '#AED6F1' },
    { name: '２３号教室',         color: '#A9DFBF' },
    { name: '３１号教室',         color: '#FAD7A0' },
    { name: '３２号教室',         color: '#F1948A' },
    { name: '３５号教室',         color: '#C39BD3' },
    { name: '３６号教室',         color: '#F7DC6F' },
    { name: '３７号教室',         color: '#85C1E9' },
];

// ========== 定数 ==========
const DAY_NAMES  = ['月', '火', '水', '木', '金', '土'];
const SLOT_H     = 40;      // px / 30分
const START_H    = 7;
const END_H      = 21;
const TOTAL_MIN  = (END_H - START_H) * 60; // 840

// ========== 状態 ==========
let activeTab        = 'room';
let currentMonday    = getThisWeekMonday();
let weekData         = [];
let roomWeekData     = [];
let specialWeekData  = [];
let unsubRooms       = null;
let unsubSpecial     = null;
let defaultSchedules = [];
let currentDetail    = null;
let dragState        = null;

// ========== ユーティリティ ==========
function getThisWeekMonday(from = new Date()) {
    const d = new Date(from);
    const day = d.getDay();
    const offset = day === 0 ? 1 : 1 - day;
    d.setDate(d.getDate() + offset);
    d.setHours(0, 0, 0, 0);
    return d;
}

function getWeekDates(monday) {
    return Array.from({ length: 6 }, (_, i) => {
        const d = new Date(monday);
        d.setDate(d.getDate() + i);
        return d;
    });
}

function toDateStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function normDate(s) {
    return s ? s.replace(/\//g, '-') : '';
}

function toSlashDate(isoStr) {
    // YYYY-MM-DD → YYYY/MM/DD
    return isoStr.replace(/-/g, '/');
}

function getLocs() {
    return activeTab === 'room' ? ROOM_LOCS : SPECIAL_LOCS;
}

function getColor(name) {
    const found = getLocs().find(l => l.name === name);
    return found ? found.color : '#D5D8DC';
}

function darken(hex) {
    const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - 45);
    const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - 45);
    const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - 45);
    return `rgb(${r},${g},${b})`;
}

function timeToMin(t) {
    if (!t || t === '-') return 0;
    const [h, m] = t.split(':').map(Number);
    return (h - START_H) * 60 + (m || 0);
}

function minToTop(min) {
    return min * (SLOT_H / 30);
}

function minToTimeStr(min) {
    const abs = min + START_H * 60;
    return `${String(Math.floor(abs / 60)).padStart(2, '0')}:${String(abs % 60).padStart(2, '0')}`;
}

// ========== 重複レイアウト計算 ==========
function computeLayout(items) {
    if (!items.length) return [];
    const arr = items.map(r => ({
        ...r,
        _s: timeToMin(r.startTime),
        _e: timeToMin(r.endTime),
        _col: -1,
        _total: 1
    })).sort((a, b) => a._s - b._s);

    const colEnds = [];
    for (const item of arr) {
        let placed = false;
        for (let c = 0; c < colEnds.length; c++) {
            if (colEnds[c] <= item._s) {
                item._col = c;
                colEnds[c] = item._e;
                placed = true;
                break;
            }
        }
        if (!placed) {
            item._col = colEnds.length;
            colEnds.push(item._e);
        }
    }
    for (const item of arr) {
        let maxCol = item._col;
        for (const other of arr) {
            if (other === item) continue;
            if (other._s < item._e && other._e > item._s) {
                maxCol = Math.max(maxCol, other._col);
            }
        }
        item._total = maxCol + 1;
    }
    return arr;
}

// ========== Firestore リアルタイム購読（週単位）==========
function subscribeWeek() {
    const weekDates  = getWeekDates(currentMonday);
    const dates      = weekDates.map(toDateStr);
    const startSlash = toSlashDate(dates[0]);
    const endSlash   = toSlashDate(dates[5]);

    // 前週のリスナーを解除
    if (unsubRooms)   { unsubRooms();   unsubRooms   = null; }
    if (unsubSpecial) { unsubSpecial(); unsubSpecial = null; }
    roomWeekData = []; specialWeekData = [];

    unsubRooms = db.collection('reservations')
        .where('date', '>=', startSlash)
        .where('date', '<=', endSlash)
        .onSnapshot(snap => {
            roomWeekData = [];
            snap.forEach(doc => {
                const d = { id: doc.id, ...doc.data() };
                const nd = normDate(d.date || '');
                if (dates.includes(nd)) { d._date = nd; roomWeekData.push(d); }
            });
            if (activeTab === 'room') { weekData = roomWeekData; renderWeek(); }
        }, err => console.error('reservations snapshot error:', err));

    unsubSpecial = db.collection('special_rooms')
        .where('date', '>=', startSlash)
        .where('date', '<=', endSlash)
        .onSnapshot(snap => {
            specialWeekData = [];
            snap.forEach(doc => {
                const d = { id: doc.id, ...doc.data() };
                const nd = normDate(d.date || '');
                if (dates.includes(nd)) { d._date = nd; specialWeekData.push(d); }
            });
            if (activeTab === 'special') { weekData = specialWeekData; renderWeek(); }
        }, err => console.error('special_rooms snapshot error:', err));
}

// ========== タイムライン描画 ==========
function buildTimeLabels() {
    const col = document.getElementById('time-col');
    col.innerHTML = '';
    for (let h = START_H; h <= END_H; h++) {
        const label = document.createElement('div');
        label.className = 'time-label';
        label.style.top = `${(h - START_H) * 80}px`;
        label.textContent = `${h}:00`;
        col.appendChild(label);
    }
}

function buildGridLines(col) {
    for (let i = 0; i <= 28; i++) {
        const line = document.createElement('div');
        // i=0→7:00(hour), i=1→7:30(half), i=2→8:00(hour)...
        line.className = `grid-line ${i % 2 === 0 ? 'hour' : 'half'}`;
        line.style.top = `${i * SLOT_H}px`;
        col.appendChild(line);
    }
}

function renderWeek() {
    const dates = getWeekDates(currentMonday);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const todayStr = toDateStr(today);

    // 週ラベル更新
    const s = dates[0], e = dates[5];
    document.getElementById('week-label').textContent =
        `${s.getFullYear()}/${String(s.getMonth()+1).padStart(2,'0')}/${String(s.getDate()).padStart(2,'0')}（月）〜 ` +
        `${String(e.getMonth()+1).padStart(2,'0')}/${String(e.getDate()).padStart(2,'0')}（土）`;

    // 曜日ヘッダー更新
    dates.forEach((d, i) => {
        const el = document.getElementById(`dh-${i}`);
        el.textContent = `${DAY_NAMES[i]}  ${d.getMonth()+1}/${d.getDate()}`;
        el.classList.toggle('today-col', toDateStr(d) === todayStr);
    });

    // 曜日列を描画
    dates.forEach((d, i) => {
        const col = document.getElementById(`day-col-${i}`);
        const dateStr = toDateStr(d);
        col.dataset.date = dateStr;
        col.classList.toggle('today-col', dateStr === todayStr);

        // グリッド線＋ブロックを再構築（grid-lineは残してもOKだが全クリアが安全）
        col.innerHTML = '';
        buildGridLines(col);

        // デフォルト使用ブロック＋予約ブロックを合わせてレイアウト
        const dayItems = weekData.filter(r => r._date === dateStr);
        const tabType  = activeTab === 'room' ? 'room' : 'special';
        const dayDefaults = defaultSchedules
            .filter(d => d.type === tabType && d.dayOfWeek === i)
            .map(d => ({ ...d, _isDefault: true }));
        computeLayout([...dayDefaults, ...dayItems]).forEach(r => {
            col.appendChild(r._isDefault ? createDefaultBlock(r) : createBlock(r));
        });

        // 今日の現在時刻ライン
        if (dateStr === todayStr) {
            const line = document.createElement('div');
            line.className = 'current-time-line';
            line.id = 'cur-time-line';
            updateTimeLine(line);
            col.appendChild(line);
        }
    });
}

function createBlock(r) {
    const color = getColor(r.location);
    const startM = Math.max(0, timeToMin(r.startTime));
    const endM   = Math.min(TOTAL_MIN, timeToMin(r.endTime));
    const top    = minToTop(startM);
    const height = Math.max(18, minToTop(endM - startM));
    const wPct   = 100 / r._total;
    const lPct   = r._col * wPct;

    const block = document.createElement('div');
    block.className = 'res-block';
    block.style.cssText =
        `top:${top}px;height:${height}px;` +
        `left:${lPct}%;width:${wPct}%;` +
        `background-color:${color};border-left:3px solid ${darken(color)};`;
    block.innerHTML =
        `<div class="res-block-location">${r.location || ''}</div>` +
        `<div class="res-block-purpose">${r.purpose || ''}</div>` +
        `<div class="res-block-user">${r.user || ''}</div>` +
        `<div class="res-block-time">${r.startTime || ''} 〜 ${r.endTime || ''}</div>`;
    block.addEventListener('click', e => {
        e.stopPropagation();
        if (block.dataset.dragMoved === '1') { block.dataset.dragMoved = ''; return; }
        showDetail(r, e.clientX, e.clientY);
    });
    attachDrag(block, r);
    return block;
}

function createDefaultBlock(r) {
    const color = getColor(r.location);
    const startM = Math.max(0, timeToMin(r.startTime));
    const endM   = Math.min(TOTAL_MIN, timeToMin(r.endTime));
    const top    = minToTop(startM);
    const height = Math.max(18, minToTop(endM - startM));
    const wPct   = 100 / r._total;
    const lPct   = r._col * wPct;

    const block = document.createElement('div');
    block.className = 'default-block';
    block.style.cssText =
        `top:${top}px;height:${height}px;` +
        `left:${lPct}%;width:${wPct}%;` +
        `background-color:${color};border-color:${darken(color)};`;
    block.innerHTML =
        `<div class="default-block-purpose">${r.purpose || ''}</div>` +

}

// ========== ドラッグ移動 ==========
function attachDrag(block, r) {
    let startClientX = 0, startClientY = 0;
    let offsetX = 0, offsetY = 0;
    let duration = 0;
    let ghost = null;
    let moved = false;

    block.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        e.preventDefault();
        const rect = block.getBoundingClientRect();
        startClientX = e.clientX;
        startClientY = e.clientY;
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        duration = timeToMin(r.endTime) - timeToMin(r.startTime);
        moved = false;

        ghost = document.createElement('div');
        ghost.className = 'res-block drag-ghost';
        ghost.innerHTML = block.innerHTML;
        ghost.style.cssText =
            block.style.cssText +
            `;position:fixed;pointer-events:none;z-index:1000;` +
            `width:${rect.width}px;height:${rect.height}px;` +
            `left:${rect.left}px;top:${rect.top}px;` +
            `opacity:0.85;box-shadow:0 6px 20px rgba(0,0,0,0.25);`;
        document.body.appendChild(ghost);
        block.classList.add('dragging');
        block.setPointerCapture(e.pointerId);
    });

    block.addEventListener('pointermove', e => {
        if (!ghost) return;
        if (!moved && (Math.abs(e.clientX - startClientX) > 4 || Math.abs(e.clientY - startClientY) > 4)) {
            moved = true;
        }
        ghost.style.left = `${e.clientX - offsetX}px`;
        ghost.style.top  = `${e.clientY - offsetY}px`;
    });

    block.addEventListener('pointerup', async e => {
        if (!ghost) return;
        ghost.remove(); ghost = null;
        block.classList.remove('dragging');

        if (!moved) return; // クリック扱い（詳細ポップアップはclickイベントに任せる）

        block.dataset.dragMoved = '1'; // clickイベントを抑制

        // ドロップ先の曜日列を特定
        let targetCol = null;
        for (let i = 0; i < 6; i++) {
            const col = document.getElementById(`day-col-${i}`);
            const rect = col.getBoundingClientRect();
            if (e.clientX >= rect.left && e.clientX <= rect.right) { targetCol = col; break; }
        }
        if (!targetCol || !targetCol.dataset.date) return;

        // ブロックの上端位置 → 新しい開始時刻（15分スナップ）
        const colRect = targetCol.getBoundingClientRect();
        const topInCol = (e.clientY - offsetY) - colRect.top;
        const rawMin   = topInCol / (SLOT_H / 30);
        const snapped  = Math.round(rawMin / 15) * 15;
        const newStart = Math.max(0, Math.min(TOTAL_MIN - duration, snapped));
        const newEnd   = newStart + duration;

        const colName = activeTab === 'room' ? 'reservations' : 'special_rooms';
        try {
            await db.collection(colName).doc(r.id).update({
                date:      toSlashDate(targetCol.dataset.date),
                startTime: minToTimeStr(newStart),
                endTime:   minToTimeStr(newEnd),
            });
            // onSnapshot が自動的に画面を更新するため明示的リロード不要
        } catch (err) {
            alert('移動に失敗しました。');
            console.error(err);
        }
    });

    block.addEventListener('pointercancel', () => {
        if (ghost) { ghost.remove(); ghost = null; }
        block.classList.remove('dragging');
        moved = false;
    });
}

function updateTimeLine(line) {
    const now = new Date();
    const min = (now.getHours() - START_H) * 60 + now.getMinutes();
    line.style.display = (min >= 0 && min <= TOTAL_MIN) ? 'block' : 'none';
    if (min >= 0 && min <= TOTAL_MIN) line.style.top = `${minToTop(min)}px`;
}

async function submitReservation() {
    const purpose  = document.getElementById('m-purpose').value.trim();
    const location = document.getElementById('m-location').value;
    const dateISO  = document.getElementById('m-date').value; // YYYY-MM-DD
    const start    = document.getElementById('m-start').value;
    const end      = document.getElementById('m-end').value;
    const user     = document.getElementById('m-user').value.trim();

    if (!purpose || !user || !dateISO || !start || !end) {
        alert('すべての項目を入力してください。');
        return;
    }
    if (start >= end) {
        alert('終了時間は開始時間より後にしてください。');
        return;
    }

    const colName   = activeTab === 'room' ? 'reservations' : 'special_rooms';
    const slashDate = toSlashDate(dateISO); // YYYY/MM/DD（保存形式）

    // 重複チェック：同一場所・同一日付の既存データをFirestoreから取得
    const [snap1, snap2] = await Promise.all([
        db.collection(colName).where('date', '==', slashDate).where('location', '==', location).get(),
        db.collection(colName).where('date', '==', dateISO).where('location', '==', location).get(),
    ]);
    const existing = [];
    snap1.forEach(doc => existing.push({ id: doc.id, ...doc.data() }));
    snap2.forEach(doc => {
        const d = doc.data();
        if (normDate(d.date) !== dateISO) existing.push({ id: doc.id, ...d }); // 重複回避
    });
    // 編集中は自分自身を重複チェックから除外
    const conflict = existing.filter(r => r.id !== editingId && r.startTime < end && r.endTime > start);
    if (conflict.length > 0) {
        alert('この時間帯はすでに予約が入っています。');
        return;
    }

    if (editingId) {
        await db.collection(colName).doc(editingId).update({
            purpose, location,
            date: slashDate,
            startTime: start, endTime: end, user
        });
    } else {
        await db.collection(colName).add({
            purpose, location,
            date: slashDate,
            startTime: start, endTime: end, user,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    document.getElementById('res-modal').classList.add('hidden');
    // onSnapshot が自動的に画面を更新するため明示的リロード不要
}

// ========== 初期化 ==========
document.addEventListener('DOMContentLoaded', async () => {
    buildTimeLabels();
    renderLegend();

    // 曜日列クリック（空きエリア → 予約モーダル）
    for (let i = 0; i < 6; i++) {
        const col = document.getElementById(`day-col-${i}`);
        col.addEventListener('click', e => {
            if (e.target.closest('.res-block')) return;
            const rect = col.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const rawMin = clickY / (SLOT_H / 30);
            const snapped = Math.floor(rawMin / 30) * 30;
            const clamped = Math.max(0, Math.min(TOTAL_MIN - 30, snapped));
            openModal(col.dataset.date || '', minToTimeStr(clamped));
        });
    }

    // タブ切り替え（再購読不要 — 両コレクション同時購読済み）
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeTab = btn.dataset.tab;
            renderLegend();
            weekData = activeTab === 'room' ? roomWeekData : specialWeekData;
            renderWeek();
        });
    });

    // 週ナビゲーション
    document.getElementById('prev-week').addEventListener('click', () => {
        currentMonday = new Date(currentMonday);
        currentMonday.setDate(currentMonday.getDate() - 7);
        subscribeWeek();
    });
    document.getElementById('next-week').addEventListener('click', () => {
        currentMonday = new Date(currentMonday);
        currentMonday.setDate(currentMonday.getDate() + 7);
        subscribeWeek();
    });
    document.getElementById('today-btn').addEventListener('click', () => {
        currentMonday = getThisWeekMonday();
        subscribeWeek();
    });

    // 新規予約ボタン
    document.getElementById('add-res-btn').addEventListener('click', () => {
        openModal(toDateStr(new Date()), '09:00');
    });

    // モーダル操作
    document.getElementById('m-cancel').addEventListener('click', () => {
        document.getElementById('res-modal').classList.add('hidden');
    });
    document.getElementById('res-modal').addEventListener('click', e => {
        if (e.target === document.getElementById('res-modal'))
            document.getElementById('res-modal').classList.add('hidden');
    });
    document.getElementById('m-submit').addEventListener('click', submitReservation);

    // 詳細ポップアップ
    document.getElementById('detail-close').addEventListener('click', hideDetail);
    document.addEventListener('click', e => {
        if (!e.target.closest('#detail-popup') && !e.target.closest('.res-block'))
            hideDetail();
    });
    document.getElementById('detail-edit-btn').addEventListener('click', () => {
        if (!currentDetail) return;
        hideDetail();
        openEditModal(currentDetail);
    });
    document.getElementById('detail-delete-btn').addEventListener('click', async () => {
        if (!currentDetail) return;
        if (!confirm('この予約を削除しますか？')) return;
        const colName = activeTab === 'room' ? 'reservations' : 'special_rooms';
        await db.collection(colName).doc(currentDetail.id).delete();
        hideDetail();
        // onSnapshot が自動的に画面を更新するため明示的リロード不要
    });

    // 現在時刻ラインを1分ごとに更新
    setInterval(() => {
        const line = document.getElementById('cur-time-line');
        if (line) updateTimeLine(line);
    }, 60000);

    // ── デフォルトCSV登録 ──
    const DAY_NAME_MAP = { '月':0, '火':1, '水':2, '木':3, '金':4, '土':5 };
    const TYPE_MAP     = { '会議室':'room', '特別教室':'special' };
    let parsedDefaults = [];

    document.getElementById('csv-default-open-btn').addEventListener('click', () => {
        parsedDefaults = [];
        document.getElementById('csv-default-file').value = '';
        document.getElementById('csv-default-filename').textContent = '';
        document.getElementById('csv-default-tbody').innerHTML = '';
        document.getElementById('csv-default-preview-wrap').style.display = 'none';
        document.getElementById('csv-default-count').textContent = '';
        document.getElementById('csv-default-submit').disabled = true;
        document.getElementById('csv-default-modal').classList.remove('hidden');
    });
    document.getElementById('csv-default-download-btn').addEventListener('click', () => {
        const dayNames = ['月','火','水','木','金','土'];
        const rows = [['種別','場所','曜日','開始時間','終了時間','用途']];
        defaultSchedules.forEach(d => {
            rows.push([
                d.type === 'room' ? '会議室' : '特別教室',
                d.location,
                dayNames[d.dayOfWeek] ?? '',
                d.startTime,
                d.endTime,
                d.purpose
            ]);
        });
        const csv = rows.map(r => r.join(',')).join('\r\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'default_schedules.csv';
        a.click(); URL.revokeObjectURL(url);
    });

    document.getElementById('csv-default-cancel').addEventListener('click', () => {
        document.getElementById('csv-default-modal').classList.add('hidden');
    });
    document.getElementById('csv-default-modal').addEventListener('click', e => {
        if (e.target === document.getElementById('csv-default-modal'))
            document.getElementById('csv-default-modal').classList.add('hidden');
    });
    document.getElementById('csv-default-select-btn').addEventListener('click', () => {
        document.getElementById('csv-default-file').click();
    });
    document.getElementById('csv-default-file').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('csv-default-filename').textContent = file.name;
        const reader = new FileReader();
        reader.onload = ev => {
            const text = ev.target.result;
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            parsedDefaults = [];
            const errors = [];
            // ヘッダー行を読み飛ばす（1行目が「種別」で始まる場合）
            const start = lines[0].startsWith('種別') ? 1 : 0;
            lines.slice(start).forEach((line, idx) => {
                const cols = line.split(',').map(s => s.trim());
                if (cols.length < 6) return;
                const [typeName, location, dayName, startTime, endTime, purpose] = cols;
                const type = TYPE_MAP[typeName];
                const dayOfWeek = DAY_NAME_MAP[dayName];
                if (type === undefined || dayOfWeek === undefined) {
                    errors.push(`行${idx + start + 1}: 種別「${typeName}」または曜日「${dayName}」が不正`);
                    return;
                }
                parsedDefaults.push({ type, location, dayOfWeek, startTime, endTime, purpose });
            });

            const tbody = document.getElementById('csv-default-tbody');
            tbody.innerHTML = '';
            parsedDefaults.forEach(d => {
                const dayNames = ['月','火','水','木','金','土'];
                const typeLabel = d.type === 'room' ? '会議室' : '特別教室';
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${typeLabel}</td><td>${d.location}</td><td>${dayNames[d.dayOfWeek]}</td><td>${d.startTime}</td><td>${d.endTime}</td><td>${d.purpose}</td>`;
                tbody.appendChild(tr);
            });

            document.getElementById('csv-default-preview-wrap').style.display = parsedDefaults.length ? 'block' : 'none';
            document.getElementById('csv-default-count').textContent =
                parsedDefaults.length ? `${parsedDefaults.length} 件を読み込みました。` + (errors.length ? `（スキップ ${errors.length} 件）` : '') : 'データが読み込めませんでした。';
            document.getElementById('csv-default-submit').disabled = parsedDefaults.length === 0;
        };
        reader.readAsText(file, 'UTF-8');
    });
    document.getElementById('csv-default-submit').addEventListener('click', async () => {
        if (!parsedDefaults.length) return;
        document.getElementById('csv-default-submit').disabled = true;
        document.getElementById('csv-default-submit').textContent = '登録中...';

        // 既存デフォルトを全削除してから新規追加
        const existing = await db.collection('default_schedules').get();
        const batch = db.batch();
        existing.forEach(doc => batch.delete(doc.ref));
        parsedDefaults.forEach(d => batch.set(db.collection('default_schedules').doc(), d));
        await batch.commit();

        await fetchDefaultSchedules();
        renderWeek();
        document.getElementById('csv-default-modal').classList.add('hidden');
        document.getElementById('csv-default-submit').textContent = '登録する';
    });

    // 初回データ取得＆描画
    await fetchDefaultSchedules();
    subscribeWeek(); // 初回購読（onSnapshot が到着時に renderWeek を呼ぶ）
});
</script>
</body>
</html>
