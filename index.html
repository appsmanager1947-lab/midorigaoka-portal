<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教職員用ポータルサイト | 緑ヶ丘女子高等学校</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./static/ロゴ緑.png" alt="学校ロゴ" style="width: 40px; height: 40px; object-fit: contain; margin-right: 12px;">
                <div class="header-text">
                    <span class="school-name">緑ヶ丘女子高等学校</span>
                    <h1 style="margin: 0; font-size: 18px;">教職員ポータル</h1>
                </div>
            </div>
            <div class="sidebar-section">
                <h2 class="sidebar-title">ショートカット</h2>
                <ul class="app-list">
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <section class="announcements" style="margin-bottom: 40px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h2 class="section-title" style="margin: 0;">■本日の連絡事項</h2>
                </div>
                
                <a href="/notices?category=all" class="card" style="display: block; text-align: center; padding: 16px; margin-bottom: 16px; text-decoration: none; color: #4A4643; font-weight: bold; border: 2px solid #E6E4DF; background-color: #F7F7F5; border-radius: 8px; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#E6E4DF'; this.style.borderColor='#dcd9d3';" onmouseout="this.style.backgroundColor='#F7F7F5'; this.style.borderColor='#E6E4DF';">
                    📄 連絡事項を一括確認
                </a>

                <div class="card-grid" style="display: flex; flex-wrap: nowrap; gap: 12px; overflow-x: auto;">
                    <a href="/notices?category=全教職員" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 4px; text-decoration: none; color: inherit; font-weight: bold; display: block; border-top: 4px solid #FADBD8;">全教職員</a>
                    <a href="/notices?category=中学" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 4px; text-decoration: none; color: inherit; font-weight: bold; display: block; border-top: 4px solid #D6EAF8;">中学</a>
                    <a href="/notices?category=高１" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 4px; text-decoration: none; color: inherit; font-weight: bold; display: block; border-top: 4px solid #D5F5E3;">高１</a>
                    <a href="/notices?category=高２" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 4px; text-decoration: none; color: inherit; font-weight: bold; display: block; border-top: 4px solid #FCF3CF;">高２</a>
                    <a href="/notices?category=高３" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 4px; text-decoration: none; color: inherit; font-weight: bold; display: block; border-top: 4px solid #E8DAEF;">高３</a>
                </div>
            </section>
            
            <section class="active-list-section">
                <div class="list-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="section-title" style="margin: 0;">■サブミッションズリスト</h2>
                    <div>
                        <a href="/submissions" class="btn-cancel" style="margin-right: 8px; text-decoration: none; display: inline-block;">すべて表示</a>
                        <button id="add-btn" class="add-button">＋ 新規</button>
                    </div>
                </div>
                <div class="table-scroll-container" style="max-height: 230px; overflow-y: auto;">
                    <table class="active-table">
                        <thead>
                            <tr>
                                <th>内容</th>
                                <th>部署</th>
                                <th>締切</th>
                                <th>URL</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="active-list-body">
                            </tbody>
                    </table>
                </div>
            </section>

            <section class="board-section" style="margin-top: 40px; margin-bottom: 40px;">
                <div class="list-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="section-title" style="margin: 0;">■共有掲示板</h2>
                    <div>
                        <a href="/boards" class="btn-cancel" style="margin-right: 8px; text-decoration: none; display: inline-block;">すべて表示</a>
                        <a href="/board_edit" class="add-button" style="text-decoration: none; display: inline-block;">＋ 新規</a>
                    </div>
                </div>
                <div class="table-scroll-container" style="max-height: 230px; overflow-y: auto;">
                    <table class="active-table">
                        <thead>
                            <tr>
                                <th>内容</th>
                                <th>部署</th>
                                <th>掲載期間</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="board-list-body">
                            </tbody>
                    </table>
                </div>
            </section>

            <section class="archive-section" style="margin-top: 40px; margin-bottom: 40px;">
                <div class="list-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 class="section-title" style="margin: 0;">■アーカイブ</h2>
                </div>
                <div class="card-grid" style="display: flex; flex-wrap: nowrap; gap: 12px; overflow-x: auto;">
                    <a href="/reservations" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 8px; cursor: pointer; text-decoration: none; color: inherit; display: block; border-top: 4px solid #D1F2EB;">会議室等予約</a>
                    <a href="/timetable" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 8px; cursor: pointer; text-decoration: none; color: inherit; display: block; border-top: 4px solid #FAD7A0;">各クラス時間割</a>
                    <a href="/status" class="card" style="flex: 1; min-width: 0; text-align: center; padding: 16px 8px; cursor: pointer; text-decoration: none; color: inherit; display: block; border-top: 4px solid #AED6F1;">勤務・出張・来客</a>
                </div>
            </section>

            <section class="column-section">
                <div class="column-header">
                    <h2 class="section-title">■コラムリスト</h2>
                    <div class="column-actions">
                        <a href="/columns" class="btn-cancel" style="margin-right: 8px; text-decoration: none; display: inline-block;">すべて表示</a>
                        <a href="/column_edit" class="add-button" style="text-decoration: none; display: inline-block;">＋ 新規</a>
                    </div>
                </div>
                <div class="column-grid" id="column-list-container">
                    </div>
            </section>
            
            <section class="applications-section" style="margin-top: 40px; margin-bottom: 40px;">
                <div class="list-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="section-title" style="margin: 0;">■アプリケーション</h2>
                    <div>
                        <button id="edit-webapp-btn" style="background: transparent; color: #aaa; border: none; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 4px; margin-right: 4px;">編集</button>
                        <button id="add-webapp-btn" style="background: transparent; color: #aaa; border: none; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 4px;">＋ 新規</button>
                    </div>
                </div>
                <div id="webapp-grid" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-top: 16px;">
                    </div>
            </section>

            <section class="dashboard-section" style="margin-top: 40px; margin-bottom: 40px;">
                <div class="list-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="section-title" style="margin: 0;">■ダッシュボード</h2>
                    <div>
                        <button id="edit-dashboard-btn" style="background: transparent; color: #aaa; border: none; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 4px; margin-right: 4px;">編集</button>
                        <button id="add-dashboard-btn" style="background: transparent; color: #aaa; border: none; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 4px;">＋ 新規</button>
                    </div>
                </div>
                <div id="dashboard-grid" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-top: 16px;">
                    </div>
            </section>
        </main>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="modal-title">リストに追加</h3>
            <div class="form-group">
                <label for="item-title">内容</label>
                <input type="text" id="item-title" class="modal-input" placeholder="例：実習スケジュールの調整">
            </div>
            <div class="form-group">
                <label for="item-dept">部署</label>
                <input type="text" id="item-dept" class="modal-input" list="dept-options" placeholder="選択または入力してください">
                <datalist id="dept-options">
                    <option value="教職員"></option>
                    <option value="進路指導部"></option>
                    <option value="教務部"></option>
                    <option value="生徒指導部"></option>
                    <option value="入試対策部"></option>
                    <option value="総務部"></option>
                    <option value="生徒会"></option>
                </datalist>
            </div>
            <div class="form-group">
                <label for="item-date">締切</label>
                <input type="date" id="item-date" class="modal-input">
            </div>
            <div class="form-group">
                <label for="item-url">URL (任意)</label>
                <input type="text" id="item-url" class="modal-input" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button id="modal-cancel" class="btn-cancel">キャンセル</button>
                <button id="modal-submit" class="btn-submit">登録</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <script src="./static/js/firebase_init.js"></script>
    <script src="./static/js/ui_common.js"></script>
    <script src="./static/js/portal_features.js"></script>
    <script src="./static/js/portal_editor.js"></script>
</body>
</html>
