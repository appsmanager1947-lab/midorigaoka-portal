<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コラム編集 | 教職員用ポータルサイト</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./static/ロゴ緑.png" alt="学校ロゴ" style="width: 40px; height: 40px; object-fit: contain; margin-right: 12px;">
                <div class="header-text">
                    <span class="school-name">緑ヶ丘女子高等学校</span>
                    <h1 style="margin: 0; font-size: 18px;">教職員ポータル</h1>
                </div>
            </div>
            <div class="sidebar-section">
                <h2 class="sidebar-title">ショートカット</h2>
                <ul class="app-list"></ul>
            </div>
        </aside>

        <main class="main-content">
            <div class="editor-header-actions" style="border-bottom: none; justify-content: flex-end;">
                <div class="editor-buttons">
                    <div class="dropdown">
                        <button id="btn-save-draft" class="btn-cancel">下書きを保存</button>
                        <button class="btn-cancel dropdown-toggle">▼</button>
                        <div class="dropdown-content">
                            <a href="#" id="btn-open-drafts">下書きを編集 (一覧を開く)</a>
                        </div>
                    </div>
                    <button id="btn-publish" class="btn-submit">公開する</button>
                </div>
            </div>

            <div class="notion-editor-container">
                <div class="cover-image-area" id="cover-image-area">
                    <button id="btn-add-cover" style="background: transparent; border: none; color: #888; cursor: pointer; padding: 4px 0; margin-bottom: 16px; font-size: 14px; display: flex; align-items: center;">
                    🖼️ アイキャッチ画像を追加 
                    <span style="font-size: 12px; color: #aaa; margin-left: 12px; font-weight: normal;">
                        (推奨サイズ: 1200×300px ※どんなサイズの写真でも自動で綺麗にトリミングされます)
                    </span>
                </button>
                    <input type="file" id="edit-eyecatch-file" accept="image/png, image/jpeg" style="display: none;">
                    <img id="cover-image-preview" src="" style="display: none;">
                    <button id="btn-remove-cover" class="btn-cover-remove" style="display: none;">✕ 削除</button>
                </div>

                <input type="text" id="edit-title" class="notion-title-input" placeholder="無題のコラム">
                
                <div class="notion-meta-row">
                    <input type="hidden" id="edit-author">
                    <div id="tag-chip-wrap" class="notion-meta-input tag-chip-wrap" title="一覧から選択するかタグを入力し、Enterまたはスペースで追加">
                        <input id="tag-text-input" class="tag-text-input" placeholder="タグを選択または入力（Enter / スペース）" list="column-tag-options" autocomplete="off">
                        <datalist id="column-tag-options">
                            <option value="書類"></option>
                            <option value="教職員"></option>
                            <option value="進路指導部"></option>
                            <option value="教務部"></option>
                            <option value="生徒指導部"></option>
                            <option value="入試対策部"></option>
                            <option value="総務部"></option>
                            <option value="生徒会"></option>
                            <option value="学習サポート"></option>
                        </datalist>
                    </div>
                    <input type="date" id="edit-date" class="notion-meta-input">
                </div>

                <div id="content-type-toggle" style="display:flex; gap:8px; margin-bottom:12px;">
                    <button id="btn-mode-editor" style="padding:5px 14px; font-size:12px; border-radius:4px; border:1px solid #0066cc; background:#0066cc; color:#fff; cursor:pointer;">✏️ 自由記述</button>
                    <button id="btn-mode-html" style="padding:5px 14px; font-size:12px; border-radius:4px; border:1px solid #bbb; background:#fff; color:#555; cursor:pointer;">🔧 HTMLインポート</button>
                </div>

                <div id="edit-content" class="notion-rich-textarea" contenteditable="true" data-placeholder="「/」でメニューを表示、または入力を開始..."></div>

                <div id="html-import-area" style="display:none;">
                    <p style="font-size:12px; color:#999; margin:0 0 8px;">HTMLコードを貼り付けてください。bodyタグ内のコンテンツとstyleが抽出・再現されます。</p>
                    <textarea id="html-input" style="width:100%; height:280px; font-family:monospace; font-size:12px; border:1px solid #E6E4DF; border-radius:4px; padding:10px; resize:vertical; box-sizing:border-box;" placeholder="<!DOCTYPE html>&#10;<html>&#10;  <head>...</head>&#10;  <body>...</body>&#10;</html>"></textarea>
                    <button id="btn-preview-html" style="margin-top:8px; padding:5px 14px; font-size:12px; border-radius:4px; border:1px solid #0066cc; background:#fff; color:#0066cc; cursor:pointer;">プレビュー確認</button>
                    <iframe id="html-preview-frame" style="display:none; width:100%; margin-top:12px; border:1px solid #E6E4DF; border-radius:4px; min-height:300px;"></iframe>
                </div>
            </div>

            <div id="slash-menu" class="slash-menu hidden">
                <div class="slash-menu-item" data-command="h2">見出し (大)</div>
                <div class="slash-menu-item" data-command="h3">見出し (小)</div>
                <div class="slash-menu-item" data-command="insertUnorderedList">箇条書きリスト</div>
                <div class="slash-menu-item" data-command="insertOrderedList">番号付きリスト</div>
                <div class="slash-menu-item" data-command="insertHorizontalRule">水平線</div>
                <div class="slash-menu-item" data-command="image">📷 画像を挿入</div>
            </div>

            <div id="floating-toolbar" class="floating-toolbar hidden">
                <button data-command="bold"><b>B</b></button>
                <button data-command="italic"><i>I</i></button>
                <input type="color" id="floating-color" title="文字色">
            </div>

            <input type="file" id="hidden-img-upload" accept="image/png, image/jpeg" style="display: none;">
        </main>
    </div>

    <div id="draft-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="modal-title">下書き一覧</h3>
            <ul id="draft-list-container" class="draft-list"></ul>
            <div class="modal-actions">
                <button id="close-draft-modal" class="btn-cancel">閉じる</button>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script src="./static/js/firebase_init.js"></script>
    <script src="./static/js/ui_common.js"></script>
    <script src="./static/js/portal_features.js"></script>
    <script src="./static/js/portal_editor.js"></script>
</body>
</html>
