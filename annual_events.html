<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年間行事予定 | 教職員用ポータルサイト</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
        /* ── カレンダーナビ ── */
        .cal-nav { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:16px; }
        .cal-nav-btn { background:transparent; border:1px solid #E6E4DF; border-radius:4px; padding:4px 16px; cursor:pointer; font-size:16px; color:#4A4643; }
        .cal-nav-btn:hover { background:#E6E4DF; }
        .cal-month-label { font-size:20px; font-weight:bold; color:#4A4643; min-width:160px; text-align:center; }

        /* ── カレンダーグリッド ── */
        .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid #E6E4DF; border-left:1px solid #E6E4DF; }
        .cal-head { background:#F7F7F5; text-align:center; padding:8px 4px; font-weight:bold; font-size:13px; border-right:1px solid #E6E4DF; border-bottom:1px solid #E6E4DF; }
        .cal-head.h-sun { color:#c0392b; }
        .cal-head.h-sat { color:#1a5276; }

        .cal-cell { background:#fff; padding:4px; border-right:1px solid #E6E4DF; border-bottom:1px solid #E6E4DF; min-height:72px; overflow:hidden; min-width:0; }
        .cal-cell.c-other { background:#F9F9F9; }
        .cal-cell.c-red   { background:#FFF5F5; }
        .cal-cell.c-sat   { background:#F5F9FF; }
        .cal-cell.c-today { box-shadow:inset 0 0 0 2px #27AE60; }

        .cal-num { font-size:12px; font-weight:bold; margin-bottom:3px; }
        .cal-num.n-red { color:#c0392b; }
        .cal-num.n-sat { color:#1a5276; }

        /* ── 行事タグ ── */
        .ev-item {
            display: block; position: relative;
            font-size: 11px; padding: 2px 4px; margin: 1px 0;
            border-radius: 3px; cursor: pointer; overflow: hidden;
        }
        .ev-item > span {
            display: block; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .ev-actions {
            display: none; position: absolute;
            right: 2px; top: 50%; transform: translateY(-50%);
            background: inherit;
        }
        .ev-item:hover .ev-actions { display: flex; gap: 2px; }
        .ev-act-btn {
            background: rgba(255,255,255,0.88); border: none; border-radius: 2px;
            font-size: 10px; cursor: pointer; padding: 1px 4px; line-height: 1.6;
        }
        .ev-act-btn.del { color: #d9534f; font-weight: bold; }

        /* ── 日直タグ ── */
        .duty-item {
            display: block; position: relative;
            font-size: 11px; padding: 2px 5px; margin-bottom: 3px;
            background: #E8F5E9; border-left: 3px solid #2c8c5a;
            border-radius: 3px; overflow: hidden;
            color: #1a5c3a; font-weight: 600; cursor: default;
        }
        .duty-item > span {
            display: block; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .duty-actions {
            display: none; position: absolute;
            right: 2px; top: 50%; transform: translateY(-50%);
            background: #E8F5E9;
        }
        .duty-item:hover .duty-actions { display: flex; gap: 2px; }

        /* ── 日直履歴アイコン ── */
        .duty-history-icon {
            background: none; border: none; cursor: pointer;
            font-size: 11px; padding: 0 2px; color: #2c8c5a;
            opacity: 0.7; flex-shrink: 0;
        }
        .duty-history-icon:hover { opacity: 1; }

        /* ── 日直履歴ポップアップ ── */
        #duty-history-popup {
            position: fixed; background: #fff;
            border: 1px solid #ccc; border-radius: 8px;
            padding: 14px 16px 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 2100; min-width: 220px; max-width: 300px; display: none;
        }
        #duty-history-popup h4 { font-size: 14px; font-weight: bold; margin: 0 0 4px; padding-right: 20px; }
        .duty-hist-row { font-size: 12px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
        .duty-hist-row:last-child { border-bottom: none; }
        .duty-hist-meta { font-size: 11px; color: #aaa; margin-bottom: 2px; }

        /* ── 詳細ポップアップ ── */
        #event-popup {
            position: fixed; background: #fff; border: 1px solid #ccc;
            border-radius: 8px; padding: 14px 16px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 2000; min-width: 200px; max-width: 300px; display: none;
        }
        #popup-close { position:absolute; top:8px; right:10px; cursor:pointer; font-size:16px; color:#aaa; background:none; border:none; }
        #popup-close:hover { color:#333; }

        /* ── CSVプレビュー ── */
        #csv-preview-table, #duty-csv-preview-table { width:100%; border-collapse:collapse; font-size:12px; }
        #csv-preview-table th, #csv-preview-table td,
        #duty-csv-preview-table th, #duty-csv-preview-table td { border:1px solid #E6E4DF; padding:4px 8px; }
        #csv-preview-table th, #duty-csv-preview-table th { background:#F7F7F5; }

        /* ── 対象チェックボックス ── */
        .target-checkbox-group { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
        .target-checkbox-group label { display:flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; padding:4px 10px; border:1px solid #E6E4DF; border-radius:4px; background:#fff; user-select:none; }
        .target-checkbox-group label:hover { background:#f0f0f0; }
        .target-checkbox-group input[type=checkbox] { cursor:pointer; }

        /* ── ローディングオーバーレイ ── */
        @keyframes csv-spin { to { transform: rotate(360deg); } }
        .csv-loading {
            display: none; position: absolute; inset: 0;
            background: rgba(255,255,255,0.93);
            z-index: 10; border-radius: 8px;
            flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        .csv-loading.show { display: flex; }
        .csv-spinner {
            width: 40px; height: 40px;
            border: 4px solid #E6E4DF; border-top-color: #2c8c5a;
            border-radius: 50%;
            animation: csv-spin 0.7s linear infinite;
        }
        .csv-loading-text { font-size: 14px; color: #4A4643; font-weight: 500; }
        .csv-done-check { font-size: 40px; animation: none; border: none; background: none; }
    </style>
</head>
<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="./static/ロゴ緑.png" alt="学校ロゴ" style="width:40px;height:40px;object-fit:contain;margin-right:12px;">
                <div class="header-text">
                    <span class="school-name">緑ヶ丘女子高等学校</span>
                    <h1 style="margin:0;font-size:18px;">教職員ポータル</h1>
                </div>
            </div>
            <div class="sidebar-section"><h2 class="sidebar-title">ショートカット</h2><ul class="app-list"></ul></div>
        </aside>

        <main class="main-content">
            <section class="column-section" style="margin-top:0; margin-bottom:40px;">
                <div class="column-header">
                    <h2 class="section-title">年間行事予定</h2>
                    <div style="display:flex; gap:8px;">
                        <button id="csv-btn" class="btn-cancel">CSVアップロード</button>
                        <button id="duty-csv-btn" class="btn-cancel">日直CSV</button>
                        <button id="add-btn" class="add-button">＋ 追加</button>
                    </div>
                </div>
                <div class="cal-nav">
                    <button id="prev-btn" class="cal-nav-btn">◀</button>
                    <span id="month-label" class="cal-month-label"></span>
                    <button id="next-btn" class="cal-nav-btn">▶</button>
                    <button id="goto-april-btn" class="cal-nav-btn" style="font-size:12px;padding:4px 10px;">今年度4月</button>
                </div>
                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0 8px;font-size:11px;color:#4A4643;">
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#FADBD8;border-radius:2px;border:1px solid #e0c0be;flex-shrink:0;"></span>全校</span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#D6EAF8;border-radius:2px;border:1px solid #b5d0e8;flex-shrink:0;"></span>中学</span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#D5F5E3;border-radius:2px;border:1px solid #b0dcc4;flex-shrink:0;"></span>高１</span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#FCF3CF;border-radius:2px;border:1px solid #e0d8a0;flex-shrink:0;"></span>高２</span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#FDEBD0;border-radius:2px;border:1px solid #e0c8a0;flex-shrink:0;"></span>高３</span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#D7BDE2;border-radius:2px;border:1px solid #bfa0cc;flex-shrink:0;"></span>教職員</span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#D5D8DC;border-radius:2px;border:1px solid #b8bcc0;flex-shrink:0;"></span>その他</span>
                    <span style="width:1px;height:14px;background:#E6E4DF;flex-shrink:0;"></span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#E8F5E9;border-left:3px solid #2c8c5a;border-radius:2px;flex-shrink:0;"></span>日直</span>
                    <span style="width:1px;height:14px;background:#E6E4DF;flex-shrink:0;"></span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#FFF5F5;border-radius:2px;border:1px solid #e0c0c0;flex-shrink:0;"></span><span style="color:#c0392b;">日・祝</span></span>
                    <span style="display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:12px;height:12px;background:#F5F9FF;border-radius:2px;border:1px solid #b0c8e0;flex-shrink:0;"></span><span style="color:#1a5276;">土</span></span>
                </div>
                <div style="text-align:right;font-size:12px;color:#888;margin-bottom:4px;" id="ev-total-count"></div>
                <div id="cal-wrap"></div>
            </section>
        </main>
    </div>

    <!-- ── 追加／編集モーダル ── -->
    <div id="ev-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="ev-modal-title" class="modal-title">行事を追加</h3>
            <div class="form-group">
                <label>期間（終了日は省略可・単日なら開始日のみ）</label>
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                    <input type="date" id="ev-date-from" class="modal-input" style="flex:1; min-width:130px; margin:0;">
                    <span style="color:#888; white-space:nowrap; font-size:14px;">〜</span>
                    <input type="date" id="ev-date-to" class="modal-input" style="flex:1; min-width:130px; margin:0;">
                </div>
            </div>
            <div class="form-group">
                <label>行事名（必須）</label>
                <input type="text" id="ev-title" class="modal-input" placeholder="例：文化祭">
            </div>
            <div class="form-group">
                <label>対象（複数選択可）</label>
                <div class="target-checkbox-group">
                    <label><input type="checkbox" name="ev-target" value="全校"> 全校</label>
                    <label><input type="checkbox" name="ev-target" value="中学"> 中学</label>
                    <label><input type="checkbox" name="ev-target" value="高１"> 高１</label>
                    <label><input type="checkbox" name="ev-target" value="高２"> 高２</label>
                    <label><input type="checkbox" name="ev-target" value="高３"> 高３</label>
                    <label><input type="checkbox" name="ev-target" value="教職員"> 教職員</label>
                    <label><input type="checkbox" name="ev-target" value="その他"> その他</label>
                </div>
            </div>
            <div class="form-group">
                <label>備考</label>
                <input type="text" id="ev-note" class="modal-input" placeholder="任意">
            </div>
            <div class="form-group">
                <label>日直（開始日に設定・省略可）</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="ev-duty1" class="modal-input" placeholder="日直1" style="margin:0;">
                    <input type="text" id="ev-duty2" class="modal-input" placeholder="日直2" style="margin:0;">
                </div>
            </div>
            <div class="form-group">
                <label>色プレビュー</label>
                <div id="ev-color-preview" style="height:28px;border-radius:4px;border:1px solid #ccc;background:#F0F0F0;"></div>
            </div>
            <div class="modal-actions">
                <button id="ev-cancel" class="btn-cancel">キャンセル</button>
                <button id="ev-submit" class="btn-submit">追加</button>
            </div>
        </div>
    </div>

    <!-- ── CSVモーダル ── -->
    <div id="csv-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width:640px;width:100%;position:relative;overflow:hidden;">
            <!-- ローディングオーバーレイ -->
            <div class="csv-loading" id="csv-loading">
                <div class="csv-spinner" id="csv-spinner"></div>
                <div class="csv-loading-text" id="csv-loading-text">読み込み中...</div>
            </div>
            <h3 class="modal-title">CSVアップロード</h3>
            <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
                <button id="csv-template-btn" class="btn-cancel">テンプレートDL</button>
                <label for="csv-file" class="btn-submit" style="cursor:pointer;display:inline-block;">ファイルを選択</label>
                <input type="file" id="csv-file" accept=".csv" style="display:none;">
                <span id="csv-filename" style="font-size:12px;color:#888;"></span>
            </div>
            <div id="csv-preview" style="display:none;">
                <p id="csv-count" style="font-size:13px;color:#555;margin:0 0 8px;"></p>
                <div style="max-height:280px;overflow-y:auto;border:1px solid #E6E4DF;border-radius:4px;">
                    <table id="csv-preview-table">
                        <thead><tr><th>開始日</th><th>終了日</th><th>行事名</th><th>対象</th><th>備考</th></tr></thead>
                        <tbody id="csv-tbody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-actions">
                <button id="csv-cancel" class="btn-cancel">キャンセル</button>
                <button id="csv-register" class="btn-submit" disabled>登録する</button>
            </div>
        </div>
    </div>

    <!-- ── 日直変更履歴ポップアップ ── -->
    <div id="duty-history-popup">
        <button id="duty-history-close" style="position:absolute;top:8px;right:10px;background:none;border:none;font-size:18px;cursor:pointer;color:#aaa;line-height:1;">×</button>
        <h4>変更履歴</h4>
        <div id="duty-history-date" style="font-size:12px;color:#888;margin-bottom:8px;"></div>
        <div id="duty-history-list"></div>
    </div>

    <!-- ── 日直編集モーダル ── -->
    <div id="duty-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width:340px;">
            <h3 class="modal-title">日直を編集</h3>
            <div class="form-group">
                <label>日付</label>
                <div id="duty-modal-date" style="font-weight:bold;padding:4px 0;font-size:14px;"></div>
            </div>
            <div class="form-group">
                <label>日直</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="duty-modal-1" class="modal-input" placeholder="日直1" style="margin:0;">
                    <input type="text" id="duty-modal-2" class="modal-input" placeholder="日直2" style="margin:0;">
                </div>
            </div>
            <div class="modal-actions">
                <button id="duty-modal-cancel" class="btn-cancel">キャンセル</button>
                <button id="duty-modal-submit" class="btn-submit">保存</button>
            </div>
        </div>
    </div>

    <!-- ── 日直CSVモーダル ── -->
    <div id="duty-csv-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width:500px;width:100%;position:relative;overflow:hidden;">
            <div class="csv-loading" id="duty-csv-loading">
                <div class="csv-spinner" id="duty-csv-spinner"></div>
                <div class="csv-loading-text" id="duty-csv-loading-text">読み込み中...</div>
            </div>
            <h3 class="modal-title">日直CSVアップロード</h3>
            <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
                <input type="number" id="duty-template-year" class="modal-input" style="width:90px;margin:0;" placeholder="年度">
                <span style="font-size:13px;color:#666;">年度</span>
                <button id="duty-template-btn" class="btn-cancel">テンプレートDL</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
                <label for="duty-csv-file" class="btn-submit" style="cursor:pointer;display:inline-block;">ファイルを選択</label>
                <input type="file" id="duty-csv-file" accept=".csv" style="display:none;">
                <span id="duty-csv-filename" style="font-size:12px;color:#888;"></span>
            </div>
            <div id="duty-csv-preview" style="display:none;">
                <p id="duty-csv-count" style="font-size:13px;color:#555;margin:0 0 8px;"></p>
                <div style="max-height:260px;overflow-y:auto;border:1px solid #E6E4DF;border-radius:4px;">
                    <table id="duty-csv-preview-table">
                        <thead><tr><th>日付</th><th>日直1</th><th>日直2</th></tr></thead>
                        <tbody id="duty-csv-tbody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-actions">
                <button id="duty-csv-cancel" class="btn-cancel">キャンセル</button>
                <button id="duty-csv-register" class="btn-submit" disabled>登録する</button>
            </div>
        </div>
    </div>

    <!-- ── 行事詳細ポップアップ ── -->
    <div id="event-popup">
        <button id="popup-close">✕</button>
        <div id="popup-title" style="font-weight:bold;font-size:14px;padding-right:20px;"></div>
        <div id="popup-date"   style="font-size:12px;color:#666;margin-top:6px;"></div>
        <div id="popup-target" style="font-size:12px;color:#666;"></div>
        <div id="popup-note"   style="font-size:12px;color:#555;margin-top:6px;white-space:pre-wrap;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="./static/js/firebase_init.js"></script>
    <script src="./static/js/ui_common.js"></script>
    <script src="./static/js/portal_features.js"></script>
    <script src="./static/js/portal_editor.js"></script>

    <script>
    (function () {
        const DAYS = ['日','月','火','水','木','金','土'];

        const TARGET_COLORS = {
            '全校':'#FADBD8','中学':'#D6EAF8','高１':'#D5F5E3',
            '高２':'#FCF3CF','高３':'#FDEBD0','教職員':'#D7BDE2','その他':'#D5D8DC'
        };

        // 日本の祝日（2024〜2026）
        const HOLIDAYS = new Set([
            '2024-01-01','2024-01-08','2024-02-11','2024-02-12','2024-02-23',
            '2024-03-20','2024-04-29','2024-05-03','2024-05-04','2024-05-05','2024-05-06',
            '2024-07-15','2024-08-11','2024-08-12','2024-09-16','2024-09-22','2024-09-23',
            '2024-10-14','2024-11-03','2024-11-04','2024-11-23',
            '2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24',
            '2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06',
            '2025-07-21','2025-08-11','2025-09-15','2025-09-23',
            '2025-10-13','2025-11-03','2025-11-23','2025-11-24',
            '2026-01-01','2026-01-12','2026-02-11','2026-02-23',
            '2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06',
            '2026-07-20','2026-08-11','2026-09-21','2026-09-23',
            '2026-10-12','2026-11-03','2026-11-23',
        ]);

        let curYear  = new Date().getFullYear();
        let curMonth = new Date().getMonth(); // 0-indexed
        let allEvents = [];
        let dutyMap   = {}; // date string → { duty1, duty2 }
        let editId    = null;
        let csvRows   = [];

        function pad(n) { return String(n).padStart(2, '0'); }
        function toDs(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
        // 日付文字列を正規化: スラッシュをダッシュに変換し、ゼロ埋め（例: "2026-4-1" → "2026-04-01"）
        function normDate(s) {
            if (!s) return s;
            const parts = s.replace(/\//g, '-').split('-');
            if (parts.length !== 3) return s;
            return `${parts[0]}-${pad(parts[1])}-${pad(parts[2])}`;
        }
        // 日付文字列からDateオブジェクトを生成（ゼロ埋め不要の安全な方法）
        function parseDate(s) {
            if (!s) return new Date(NaN);
            const parts = s.replace(/\//g, '-').split('-');
            if (parts.length !== 3) return new Date(NaN);
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }

        // 対象配列 → 分割グラデーション背景
        function getTargetBackground(targets) {
            if (!targets || targets.length === 0) return '#F0F0F0';
            if (targets.length === 1) return TARGET_COLORS[targets[0]] || '#F0F0F0';
            const colors = targets.map(t => TARGET_COLORS[t] || '#F0F0F0');
            const n = colors.length;
            const stops = [];
            colors.forEach((c, i) => {
                const start = i === 0 ? 0 : Math.round(i * 10000 / n) / 100;
                const end   = i === n - 1 ? 100 : Math.round((i + 1) * 10000 / n) / 100;
                stops.push(`${c} ${start}%`, `${c} ${end}%`);
            });
            return `linear-gradient(to right, ${stops.join(', ')})`;
        }

        // イベントの targets 配列を取得（後方互換）
        function normTargetStr(s) { return s.replace(/[0-9]/g, d => '０１２３４５６７８９'[d]); }
        function getEvTargets(ev) {
            if (ev.targets && ev.targets.length) return ev.targets.map(normTargetStr);
            if (ev.target) return ev.target.split(/[,、]/).map(t => normTargetStr(t.trim())).filter(t => t);
            return [];
        }

        // チェックボックスの操作ヘルパー
        function getSelectedTargets() {
            return Array.from(document.querySelectorAll('input[name="ev-target"]:checked')).map(cb => cb.value);
        }
        function setSelectedTargets(arr) {
            document.querySelectorAll('input[name="ev-target"]').forEach(cb => { cb.checked = arr.includes(cb.value); });
            updateColorPreview();
        }
        function updateColorPreview() {
            document.getElementById('ev-color-preview').style.background = getTargetBackground(getSelectedTargets());
        }

        // ────────────────────────────────────────
        // カレンダー描画
        // ────────────────────────────────────────
        function renderCalendar() {
            document.getElementById('month-label').textContent = `${curYear}年 ${curMonth + 1}月`;
            const wrap = document.getElementById('cal-wrap');
            wrap.innerHTML = '';

            const grid = document.createElement('div');
            grid.className = 'cal-grid';

            // ヘッダー行
            DAYS.forEach((d, i) => {
                const th = document.createElement('div');
                th.className = 'cal-head' + (i===0?' h-sun': i===6?' h-sat':'');
                th.textContent = d;
                grid.appendChild(th);
            });

            // 行事マップを構築（期間対応：dateFrom〜dateTo の各日に展開）
            const evMap = {};
            allEvents.forEach(ev => {
                const from = ev.dateFrom || ev.date;
                const to   = ev.dateTo   || from;
                let d = parseDate(from);
                const toD = parseDate(to);
                while (d <= toD) {
                    const ds = toDs(d);
                    if (!evMap[ds]) evMap[ds] = [];
                    evMap[ds].push(ev);
                    d.setDate(d.getDate() + 1);
                }
            });

            const firstDay    = new Date(curYear, curMonth, 1);
            const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
            const startDow    = firstDay.getDay();
            const todayStr    = toDs(new Date());

            // セル配列
            const cells = [];
            for (let i = 0; i < startDow; i++) {
                cells.push({ d: new Date(curYear, curMonth, -(startDow-1-i)), other: true });
            }
            for (let d = 1; d <= daysInMonth; d++) {
                cells.push({ d: new Date(curYear, curMonth, d), other: false });
            }
            let next = 1;
            while (cells.length % 7 !== 0) {
                cells.push({ d: new Date(curYear, curMonth+1, next++), other: true });
            }

            cells.forEach(({ d, other }) => {
                const dow       = d.getDay();
                const ds        = toDs(d);
                const isHoliday = HOLIDAYS.has(ds);
                const isRed     = !other && (dow === 0 || isHoliday);
                const isSat     = !other && dow === 6;

                const cell = document.createElement('div');
                let cls = 'cal-cell';
                if (other) cls += ' c-other';
                else if (isRed) cls += ' c-red';
                else if (isSat) cls += ' c-sat';
                if (!other && ds === todayStr) cls += ' c-today';
                cell.className = cls;

                const num = document.createElement('div');
                num.className = 'cal-num' + (isRed ? ' n-red' : isSat ? ' n-sat' : '');
                num.textContent = d.getDate();
                cell.appendChild(num);

                if (!other) {
                    const duty = dutyMap[ds];
                    if (duty && (duty.duty1 || duty.duty2)) {
                        cell.appendChild(buildDutyItem(ds, duty));
                    }
                    (evMap[ds] || []).forEach(ev => cell.appendChild(buildEvItem(ev)));
                }
                grid.appendChild(cell);
            });

            wrap.appendChild(grid);
        }

        // ────────────────────────────────────────
        // 日直タグの構築
        // ────────────────────────────────────────
        function buildDutyItem(dateStr, duty) {
            const div = document.createElement('div');
            div.className = 'duty-item';

            const span = document.createElement('span');
            const names = [duty.duty1, duty.duty2].filter(n => n);
            span.textContent = '日直：' + names.join('・');
            div.appendChild(span);

            const acts = document.createElement('div');
            acts.className = 'duty-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'ev-act-btn';
            editBtn.textContent = '✏';
            editBtn.title = '編集';
            editBtn.addEventListener('click', e => { e.stopPropagation(); openDutyModal(dateStr); });

            const delBtn = document.createElement('button');
            delBtn.className = 'ev-act-btn del';
            delBtn.textContent = '×';
            delBtn.title = '削除';
            delBtn.addEventListener('click', e => {
                e.stopPropagation();
                if (confirm('この日の日直を削除しますか？')) {
                    db.collection('daily_duty').doc(dateStr).delete();
                }
            });

            acts.appendChild(editBtn);
            acts.appendChild(delBtn);
            div.appendChild(acts);

            // 変更履歴アイコン（履歴がある場合のみ）
            if (duty.history && duty.history.length > 0) {
                const histBtn = document.createElement('button');
                histBtn.className = 'duty-history-icon';
                histBtn.textContent = '🕐';
                histBtn.title = `変更履歴（${duty.history.length}件）`;
                histBtn.addEventListener('click', e => { e.stopPropagation(); showDutyHistory(dateStr, duty); });
                div.appendChild(histBtn);
            }

            return div;
        }

        // ────────────────────────────────────────
        // 日直変更履歴ポップアップ
        // ────────────────────────────────────────
        function showDutyHistory(dateStr, duty) {
            const popup = document.getElementById('duty-history-popup');
            document.getElementById('duty-history-date').textContent = dateStr + ' の変更前ログ';
            const list = document.getElementById('duty-history-list');
            list.innerHTML = '';
            const history = [...(duty.history || [])].sort((a, b) => b.changedAt.localeCompare(a.changedAt));
            history.forEach(h => {
                const names = [h.duty1, h.duty2].filter(n => n).join('・');
                const d = new Date(h.changedAt);
                const label = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 変更前`;
                const row = document.createElement('div');
                row.className = 'duty-hist-row';
                row.innerHTML = `<div class="duty-hist-meta">${label}</div><div>${names || '（なし）'}</div>`;
                list.appendChild(row);
            });
            popup.style.display = 'block';
            popup.style.left = '50%';
            popup.style.top = '50%';
            popup.style.transform = 'translate(-50%, -50%)';
        }
        document.getElementById('duty-history-close').addEventListener('click', () => {
            document.getElementById('duty-history-popup').style.display = 'none';
        });

        // ────────────────────────────────────────
        // 行事タグの構築
        // ────────────────────────────────────────
        function buildEvItem(ev) {
            const div = document.createElement('div');
            div.className = 'ev-item';
            const targets = getEvTargets(ev);
            div.style.background = getTargetBackground(targets);
            div.title = ev.title + (targets.length ? ` [${targets.join('・')}]` : '');

            const span = document.createElement('span');
            span.textContent = ev.title;
            div.appendChild(span);

            const acts = document.createElement('div');
            acts.className = 'ev-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'ev-act-btn';
            editBtn.textContent = '✏';
            editBtn.title = '編集';
            editBtn.addEventListener('click', e => { e.stopPropagation(); openEditModal(ev); });

            const delBtn = document.createElement('button');
            delBtn.className = 'ev-act-btn del';
            delBtn.textContent = '×';
            delBtn.title = '削除';
            delBtn.addEventListener('click', e => { e.stopPropagation(); deleteEvent(ev.id); });

            acts.appendChild(editBtn);
            acts.appendChild(delBtn);
            div.appendChild(acts);

            div.addEventListener('click', e => showPopup(ev, e));
            return div;
        }

        // ────────────────────────────────────────
        // 詳細ポップアップ
        // ────────────────────────────────────────
        function showPopup(ev, e) {
            const from = ev.dateFrom || ev.date;
            const to   = ev.dateTo   || from;
            const dateStr = (to && to !== from) ? `${from} 〜 ${to}` : from;
            document.getElementById('popup-title').textContent  = ev.title;
            document.getElementById('popup-date').textContent   = `日付：${dateStr}`;
            const popupTargets = getEvTargets(ev);
            document.getElementById('popup-target').textContent = popupTargets.length ? `対象：${popupTargets.join('・')}` : '';
            document.getElementById('popup-note').textContent   = ev.note   ? `備考：${ev.note}`   : '';

            const popup = document.getElementById('event-popup');
            const x = Math.min(e.clientX + 12, window.innerWidth  - 330);
            const y = Math.min(e.clientY + 12, window.innerHeight - 160);
            popup.style.left    = x + 'px';
            popup.style.top     = y + 'px';
            popup.style.display = 'block';
            e.stopPropagation();
        }

        document.getElementById('popup-close').addEventListener('click', () => {
            document.getElementById('event-popup').style.display = 'none';
        });
        document.addEventListener('click', () => {
            document.getElementById('event-popup').style.display = 'none';
        });

        // ────────────────────────────────────────
        // 日直編集モーダル
        // ────────────────────────────────────────
        let dutyEditDate = null;
        const dutyModal = document.getElementById('duty-modal');

        function openDutyModal(dateStr) {
            dutyEditDate = dateStr;
            document.getElementById('duty-modal-date').textContent = dateStr;
            const duty = dutyMap[dateStr] || {};
            document.getElementById('duty-modal-1').value = duty.duty1 || '';
            document.getElementById('duty-modal-2').value = duty.duty2 || '';
            dutyModal.classList.remove('hidden');
        }

        document.getElementById('duty-modal-cancel').addEventListener('click', () => dutyModal.classList.add('hidden'));

        document.getElementById('duty-modal-submit').addEventListener('click', () => {
            if (!dutyEditDate) return;
            const duty1 = document.getElementById('duty-modal-1').value.trim();
            const duty2 = document.getElementById('duty-modal-2').value.trim();
            const btn = document.getElementById('duty-modal-submit');
            btn.disabled = true; btn.textContent = '保存中...';

            const existing = dutyMap[dutyEditDate];
            const isEdit = existing && (existing.duty1 !== duty1 || existing.duty2 !== duty2);
            const ref = db.collection('daily_duty').doc(dutyEditDate);
            const savePromise = isEdit
                ? ref.update({ duty1, duty2, history: firebase.firestore.FieldValue.arrayUnion({
                    duty1: existing.duty1 || '', duty2: existing.duty2 || '',
                    changedAt: new Date().toISOString()
                  }) })
                : ref.set({ duty1, duty2 });

            savePromise
                .then(() => { btn.disabled = false; btn.textContent = '保存'; dutyModal.classList.add('hidden'); })
                .catch(() => { btn.disabled = false; btn.textContent = 'エラー'; });
        });

        // ────────────────────────────────────────
        // Firestore リアルタイム取得
        // ────────────────────────────────────────
        function startEventsListener() {
            if (typeof db === 'undefined' || !db) { setTimeout(startEventsListener, 200); return; }
            db.collection('annual_events').onSnapshot(snap => {
                allEvents = [];
                snap.forEach(doc => allEvents.push({ id: doc.id, ...doc.data() }));
                allEvents.sort((a, b) => (normDate(a.dateFrom || a.date || '')).localeCompare(normDate(b.dateFrom || b.date || '')));
                renderCalendar();
                const countEl = document.getElementById('ev-total-count');
                if (countEl) countEl.textContent = allEvents.length ? `全 ${allEvents.length} 件` : '';
            }, err => {
                console.error('annual_events onSnapshot error:', err);
                const countEl = document.getElementById('ev-total-count');
                if (countEl) countEl.textContent = '読み込みエラー: ' + err.code;
            });
        }
        function startDutiesListener() {
            if (typeof db === 'undefined' || !db) { setTimeout(startDutiesListener, 200); return; }
            db.collection('daily_duty').onSnapshot(snap => {
                dutyMap = {};
                snap.forEach(doc => { dutyMap[doc.id] = doc.data(); });
                renderCalendar();
            }, err => console.error('daily_duty onSnapshot error:', err));
        }
        startEventsListener();
        startDutiesListener();

        // ────────────────────────────────────────
        // 月ナビゲーション
        // ────────────────────────────────────────
        document.getElementById('prev-btn').addEventListener('click', () => {
            curMonth--;
            if (curMonth < 0) { curMonth = 11; curYear--; }
            renderCalendar();
        });
        document.getElementById('next-btn').addEventListener('click', () => {
            curMonth++;
            if (curMonth > 11) { curMonth = 0; curYear++; }
            renderCalendar();
        });
        document.getElementById('goto-april-btn').addEventListener('click', () => {
            // 日本の学年度：4月始まり。3月以前なら前年の4月、4月以降なら今年の4月
            const now = new Date();
            curYear  = now.getMonth() < 3 ? now.getFullYear() - 1 : now.getFullYear();
            curMonth = 3; // 4月 (0-indexed)
            renderCalendar();
        });

        // 初期描画（Firestore接続前のUI表示）
        renderCalendar();

        // ────────────────────────────────────────
        // 追加／編集モーダル
        // ────────────────────────────────────────
        const evModal = document.getElementById('ev-modal');

        function loadDutyFields(dateStr) {
            const duty = dateStr ? (dutyMap[dateStr] || {}) : {};
            document.getElementById('ev-duty1').value = duty.duty1 || '';
            document.getElementById('ev-duty2').value = duty.duty2 || '';
        }

        document.getElementById('add-btn').addEventListener('click', () => {
            editId = null;
            document.getElementById('ev-modal-title').textContent = '行事を追加';
            document.getElementById('ev-date-from').value = '';
            document.getElementById('ev-date-to').value   = '';
            document.getElementById('ev-title').value  = '';
            setSelectedTargets([]);
            document.getElementById('ev-note').value   = '';
            loadDutyFields('');
            document.getElementById('ev-submit').textContent = '追加';
            evModal.classList.remove('hidden');
        });

        document.getElementById('ev-date-from').addEventListener('change', function () {
            loadDutyFields(this.value);
        });

        function openEditModal(ev) {
            editId = ev.id;
            document.getElementById('ev-modal-title').textContent = '行事を編集';
            const dateFrom = ev.dateFrom || ev.date || '';
            document.getElementById('ev-date-from').value = dateFrom;
            document.getElementById('ev-date-to').value   = (ev.dateTo && ev.dateTo !== dateFrom) ? ev.dateTo : '';
            document.getElementById('ev-title').value  = ev.title  || '';
            setSelectedTargets(getEvTargets(ev));
            document.getElementById('ev-note').value   = ev.note   || '';
            loadDutyFields(dateFrom);
            document.getElementById('ev-submit').textContent = '更新';
            evModal.classList.remove('hidden');
        }

        // チェックボックス変更→色プレビュー更新
        document.querySelectorAll('input[name="ev-target"]').forEach(cb => {
            cb.addEventListener('change', updateColorPreview);
        });

        document.getElementById('ev-cancel').addEventListener('click', () => evModal.classList.add('hidden'));

        document.getElementById('ev-submit').addEventListener('click', () => {
            const dateFrom = document.getElementById('ev-date-from').value;
            const dateTo   = document.getElementById('ev-date-to').value || dateFrom;
            const title   = document.getElementById('ev-title').value.trim();
            const targets = getSelectedTargets();
            const note    = document.getElementById('ev-note').value.trim();
            const duty1   = document.getElementById('ev-duty1').value.trim();
            const duty2   = document.getElementById('ev-duty2').value.trim();
            const color   = targets.length === 1 ? (TARGET_COLORS[targets[0]] || '#F0F0F0') : '#F0F0F0';

            if (!dateFrom || !title) { alert('開始日と行事名は必須です。'); return; }

            const btn = document.getElementById('ev-submit');
            btn.disabled = true; btn.textContent = '保存中...';

            const data = { dateFrom, dateTo, date: dateFrom, title, targets, target: targets.join(','), note, color };
            const col  = db.collection('annual_events');
            const saveDuty = () => db.collection('daily_duty').doc(dateFrom).set({ duty1, duty2 });
            const done = () => { btn.disabled = false; btn.textContent = editId ? '更新' : '追加'; evModal.classList.add('hidden'); };
            const fail = () => { btn.disabled = false; btn.textContent = 'エラー'; };

            if (editId) {
                col.doc(editId).update(data).then(saveDuty).then(done).catch(fail);
            } else {
                data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                col.add(data).then(saveDuty).then(done).catch(fail);
            }
        });

        function deleteEvent(id) {
            if (confirm('この行事を削除しますか？')) {
                db.collection('annual_events').doc(id).delete();
            }
        }

        // ────────────────────────────────────────
        // CSVアップロード
        // ────────────────────────────────────────
        const csvModal = document.getElementById('csv-modal');

        document.getElementById('csv-btn').addEventListener('click', () => {
            csvRows = [];
            document.getElementById('csv-file').value = '';
            document.getElementById('csv-filename').textContent = '';
            document.getElementById('csv-preview').style.display = 'none';
            document.getElementById('csv-register').disabled = true;
            csvModal.classList.remove('hidden');
        });
        document.getElementById('csv-cancel').addEventListener('click', () => csvModal.classList.add('hidden'));

        // テンプレートDL
        document.getElementById('csv-template-btn').addEventListener('click', () => {
            const content = '\uFEFF日付,終了日付,行事名,対象,備考\n2026-04-08,2026-04-09,新入生オリエンテーション,全校,1泊2日\n2026-04-10,,授業開始,全校,\n';
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url; a.download = 'annual_events_template.csv'; a.click();
            URL.revokeObjectURL(url);
        });

        // ────────────────────────────────────────
        // CSV 1行をパース（クォート対応・lookbehind不使用）
        // ────────────────────────────────────────
        function parseCSVLine(line) {
            const fields = [];
            let field = '', inQ = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') { inQ = !inQ; }
                else if (ch === ',' && !inQ) { fields.push(field); field = ''; }
                else { field += ch; }
            }
            fields.push(field); // 末尾フィールド（空でも追加）
            return fields.map(f => f.trim());
        }

        // ローディングオーバーレイ制御
        function showLoading(msg) {
            const el = document.getElementById('csv-loading');
            document.getElementById('csv-spinner').style.display = 'block';
            document.getElementById('csv-loading-text').textContent = msg;
            el.classList.add('show');
        }
        function updateLoadingText(msg) {
            document.getElementById('csv-loading-text').textContent = msg;
        }
        function showDone(msg) {
            document.getElementById('csv-spinner').style.display = 'none';
            document.getElementById('csv-loading-text').innerHTML =
                `<span style="font-size:36px;">✅</span><br>${msg}`;
        }
        function hideLoading() {
            document.getElementById('csv-loading').classList.remove('show');
        }

        // ファイル選択 → プレビュー
        document.getElementById('csv-file').addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;
            document.getElementById('csv-filename').textContent = file.name;
            document.getElementById('csv-preview').style.display = 'none';
            document.getElementById('csv-register').disabled = true;
            showLoading('ファイルを読み込んでいます...');

            const reader = new FileReader();
            reader.onload = e => {
                let text = e.target.result;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // BOM除去

                const lines = text.split(/\r?\n/).filter(l => l.trim());
                csvRows = [];
                const tbody = document.getElementById('csv-tbody');
                tbody.innerHTML = '';

                // ヘッダーで列数を判定（5列 = 終了日付あり、4列 = 旧フォーマット）
                const headerCols = parseCSVLine(lines[0] || '');
                const hasDateTo = headerCols.length >= 5;

                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    let dateFrom, dateTo, title, target, note;
                    if (hasDateTo) {
                        [dateFrom, dateTo, title, target, note] = [cols[0]||'', cols[1]||'', cols[2]||'', cols[3]||'', cols[4]||''];
                    } else {
                        [dateFrom, title, target, note] = [cols[0]||'', cols[1]||'', cols[2]||'', cols[3]||''];
                        dateTo = '';
                    }
                    dateFrom = normDate(dateFrom);
                    dateTo   = normDate(dateTo);
                    if (!dateTo) dateTo = dateFrom;
                    if (!dateFrom || !title) continue;
                    // 半角数字を全角に統一（例: "高1" → "高１"）してチェックボックス値と一致させる
                    const normTarget = s => s.replace(/[0-9]/g, d => '０１２３４５６７８９'[d]);
                    const targets = target ? target.split('、').map(t => normTarget(t.trim())).filter(t => t) : [];
                    csvRows.push({ dateFrom, dateTo, title, target, targets, note });
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${dateFrom}</td><td>${dateTo !== dateFrom ? dateTo : ''}</td><td>${title}</td><td>${target}</td><td>${note}</td>`;
                    tbody.appendChild(tr);
                }

                hideLoading();
                if (csvRows.length === 0) {
                    document.getElementById('csv-count').textContent = '有効なデータが見つかりませんでした';
                    document.getElementById('csv-preview').style.display = 'block';
                } else {
                    document.getElementById('csv-count').textContent = `${csvRows.length} 件読み込みました`;
                    document.getElementById('csv-preview').style.display = 'block';
                    document.getElementById('csv-register').disabled = false;
                }
            };
            reader.onerror = () => {
                hideLoading();
                alert('ファイルの読み込みに失敗しました。');
            };
            reader.readAsText(file, 'UTF-8');
        });

        // スマート同期：差分のみ追加・更新・削除
        document.getElementById('csv-register').addEventListener('click', async () => {
            if (!csvRows.length) return;
            const btn = document.getElementById('csv-register');
            btn.disabled = true;
            showLoading('現在のデータと照合中...');

            try {
                const col = db.collection('annual_events');

                // 既存データのキーマップを構築（スラッシュ形式の日付も正規化）
                const existingMap = {};
                allEvents.forEach(ev => {
                    const from = normDate(ev.dateFrom || ev.date);
                    const to   = normDate(ev.dateTo   || from);
                    const key  = `${from}|${to}|${ev.title}`;
                    existingMap[key] = ev;
                });

                // CSVのキーセット
                const csvKeySet = new Set(csvRows.map(r => `${r.dateFrom}|${r.dateTo}|${r.title}`));

                // 操作を分類
                const toAdd = [], toUpdate = [], toDelete = [];
                let unchanged = 0;

                csvRows.forEach(row => {
                    const key = `${row.dateFrom}|${row.dateTo}|${row.title}`;
                    const ex  = existingMap[key];
                    if (ex) {
                        const exFrom = normDate(ex.dateFrom || ex.date);
                        const exTo   = normDate(ex.dateTo   || exFrom);
                        const exTargets = (ex.targets && ex.targets.length) ? ex.targets.join('、') : (ex.target || '');
                        const rowTargets = row.targets.join('、');
                        const same   = exFrom === row.dateFrom &&
                                       exTo   === row.dateTo   &&
                                       exTargets === rowTargets &&
                                       (ex.note  ||'') === (row.note  ||'');
                        if (same) { unchanged++; }
                        else {
                            const newColor = row.targets.length === 1 ? (TARGET_COLORS[row.targets[0]] || '#F0F0F0') : '#F0F0F0';
                            toUpdate.push({ id: ex.id, data: { dateFrom: row.dateFrom, dateTo: row.dateTo, date: row.dateFrom, title: row.title, targets: row.targets, target: row.targets.join(','), note: row.note, color: newColor } });
                        }
                    } else {
                        toAdd.push(row);
                    }
                });

                allEvents.forEach(ev => {
                    const from = normDate(ev.dateFrom || ev.date);
                    const to   = normDate(ev.dateTo   || from);
                    const key  = `${from}|${to}|${ev.title}`;
                    if (!csvKeySet.has(key)) toDelete.push(ev.id);
                });

                if (toAdd.length === 0 && toUpdate.length === 0 && toDelete.length === 0) {
                    showDone(`変更なし（${unchanged} 件はそのまま）`);
                    setTimeout(() => { hideLoading(); csvModal.classList.add('hidden'); btn.disabled = false; }, 1800);
                    return;
                }

                updateLoadingText(`処理中... 追加:${toAdd.length} 更新:${toUpdate.length} 削除:${toDelete.length}`);

                const ops = [];
                toAdd.forEach(row => {
                    const color = row.targets.length === 1 ? (TARGET_COLORS[row.targets[0]] || '#F0F0F0') : '#F0F0F0';
                    ops.push({ type:'set', ref: col.doc(), data: { dateFrom: row.dateFrom, dateTo: row.dateTo, date: row.dateFrom, title: row.title, targets: row.targets, target: row.targets.join(','), note: row.note, color, createdAt: firebase.firestore.FieldValue.serverTimestamp() } });
                });
                toUpdate.forEach(({ id, data }) => ops.push({ type:'update', ref: col.doc(id), data }));
                toDelete.forEach(id => ops.push({ type:'delete', ref: col.doc(id) }));

                const BATCH_MAX = 400;
                for (let i = 0; i < ops.length; i += BATCH_MAX) {
                    const batch = db.batch();
                    ops.slice(i, i + BATCH_MAX).forEach(op => {
                        if (op.type === 'set')    batch.set(op.ref, op.data);
                        else if (op.type === 'update') batch.update(op.ref, op.data);
                        else if (op.type === 'delete') batch.delete(op.ref);
                    });
                    await batch.commit();
                }

                showDone(`完了：追加 ${toAdd.length} ・更新 ${toUpdate.length} ・削除 ${toDelete.length} ・変更なし ${unchanged}`);
                setTimeout(() => { hideLoading(); csvModal.classList.add('hidden'); btn.disabled = false; }, 2200);

            } catch (err) {
                hideLoading();
                btn.disabled = false;
                alert('エラーが発生しました。\n' + (err.message || err));
            }
        });
        // ────────────────────────────────────────
        // 日直CSV
        // ────────────────────────────────────────
        let dutyCsvRows = []; // { date, duty1, duty2 }
        const dutyCsvModal = document.getElementById('duty-csv-modal');

        // 年度の初期値（現在の学年度）
        (function () {
            const now = new Date();
            const fy = now.getMonth() < 3 ? now.getFullYear() - 1 : now.getFullYear();
            document.getElementById('duty-template-year').value = fy;
        })();

        document.getElementById('duty-csv-btn').addEventListener('click', () => {
            dutyCsvRows = [];
            document.getElementById('duty-csv-file').value = '';
            document.getElementById('duty-csv-filename').textContent = '';
            document.getElementById('duty-csv-preview').style.display = 'none';
            document.getElementById('duty-csv-register').disabled = true;
            dutyCsvModal.classList.remove('hidden');
        });
        document.getElementById('duty-csv-cancel').addEventListener('click', () => dutyCsvModal.classList.add('hidden'));

        // テンプレートDL：指定年度の全日付入りCSV
        document.getElementById('duty-template-btn').addEventListener('click', () => {
            const year = parseInt(document.getElementById('duty-template-year').value);
            if (!year || year < 2000 || year > 2100) { alert('年度を正しく入力してください（例：2026）'); return; }
            const rows = ['\uFEFF日付,日直1,日直2'];
            let d = new Date(year, 3, 1); // 4月1日
            const end = new Date(year + 1, 2, 31); // 翌年3月31日
            while (d <= end) {
                rows.push(`${toDs(d)},,`);
                d.setDate(d.getDate() + 1);
            }
            const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url; a.download = `duty_${year}.csv`; a.click();
            URL.revokeObjectURL(url);
        });

        // ファイル選択 → パース・プレビュー
        document.getElementById('duty-csv-file').addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;
            document.getElementById('duty-csv-filename').textContent = file.name;
            document.getElementById('duty-csv-preview').style.display = 'none';
            document.getElementById('duty-csv-register').disabled = true;

            const loadEl = document.getElementById('duty-csv-loading');
            document.getElementById('duty-csv-spinner').style.display = 'block';
            document.getElementById('duty-csv-loading-text').textContent = 'ファイルを読み込んでいます...';
            loadEl.classList.add('show');

            const reader = new FileReader();
            reader.onload = e => {
                let text = e.target.result;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                const lines = text.split(/\r?\n/).filter(l => l.trim());
                dutyCsvRows = [];
                const tbody = document.getElementById('duty-csv-tbody');
                tbody.innerHTML = '';
                let withDuty = 0;

                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    const date  = normDate(cols[0] || '');
                    const duty1 = (cols[1] || '').trim();
                    const duty2 = (cols[2] || '').trim();
                    if (!date) continue;
                    dutyCsvRows.push({ date, duty1, duty2 });
                    if (duty1 || duty2) {
                        withDuty++;
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${date}</td><td>${duty1}</td><td>${duty2}</td>`;
                        tbody.appendChild(tr);
                    }
                }

                loadEl.classList.remove('show');
                document.getElementById('duty-csv-count').textContent =
                    `${dutyCsvRows.length} 件読み込みました（うち日直設定あり：${withDuty} 件）`;
                document.getElementById('duty-csv-preview').style.display = 'block';
                if (dutyCsvRows.length > 0) document.getElementById('duty-csv-register').disabled = false;
            };
            reader.onerror = () => {
                document.getElementById('duty-csv-loading').classList.remove('show');
                alert('ファイルの読み込みに失敗しました。');
            };
            reader.readAsText(file, 'UTF-8');
        });

        // 日直スマート同期
        document.getElementById('duty-csv-register').addEventListener('click', async () => {
            if (!dutyCsvRows.length) return;
            const btn = document.getElementById('duty-csv-register');
            btn.disabled = true;
            const loadEl = document.getElementById('duty-csv-loading');
            document.getElementById('duty-csv-spinner').style.display = 'block';
            document.getElementById('duty-csv-loading-text').textContent = '照合中...';
            loadEl.classList.add('show');

            try {
                const col = db.collection('daily_duty');
                const ops = [];
                let unchanged = 0;

                dutyCsvRows.forEach(row => {
                    const ex = dutyMap[row.date];
                    if (row.duty1 || row.duty2) {
                        if (!ex || ex.duty1 !== row.duty1 || ex.duty2 !== row.duty2) {
                            ops.push(ex
                                ? { type: 'update', ref: col.doc(row.date), data: { duty1: row.duty1, duty2: row.duty2 }, old: { duty1: ex.duty1 || '', duty2: ex.duty2 || '' } }
                                : { type: 'set',    ref: col.doc(row.date), data: { duty1: row.duty1, duty2: row.duty2 } });
                        } else { unchanged++; }
                    } else {
                        if (ex) ops.push({ type: 'delete', ref: col.doc(row.date) });
                    }
                });

                if (ops.length === 0) {
                    document.getElementById('duty-csv-spinner').style.display = 'none';
                    document.getElementById('duty-csv-loading-text').innerHTML = `<span style="font-size:36px;">✅</span><br>変更なし（${unchanged} 件はそのまま）`;
                    setTimeout(() => { loadEl.classList.remove('show'); dutyCsvModal.classList.add('hidden'); btn.disabled = false; }, 1800);
                    return;
                }

                document.getElementById('duty-csv-loading-text').textContent = `処理中... ${ops.length} 件`;
                const BATCH_MAX = 400;
                for (let i = 0; i < ops.length; i += BATCH_MAX) {
                    const batch = db.batch();
                    ops.slice(i, i + BATCH_MAX).forEach(op => {
                        if (op.type === 'set') batch.set(op.ref, op.data);
                        else if (op.type === 'update') batch.update(op.ref, {
                            ...op.data,
                            history: firebase.firestore.FieldValue.arrayUnion({
                                duty1: op.old.duty1, duty2: op.old.duty2,
                                changedAt: new Date().toISOString()
                            })
                        });
                        else if (op.type === 'delete') batch.delete(op.ref);
                    });
                    await batch.commit();
                }

                const saved  = ops.filter(o => o.type === 'set' || o.type === 'update').length;
                const deleted = ops.filter(o => o.type === 'delete').length;
                document.getElementById('duty-csv-spinner').style.display = 'none';
                document.getElementById('duty-csv-loading-text').innerHTML =
                    `<span style="font-size:36px;">✅</span><br>完了：登録 ${saved} ・削除 ${deleted} ・変更なし ${unchanged}`;
                setTimeout(() => { loadEl.classList.remove('show'); dutyCsvModal.classList.add('hidden'); btn.disabled = false; }, 2200);

            } catch (err) {
                document.getElementById('duty-csv-loading').classList.remove('show');
                btn.disabled = false;
                alert('エラーが発生しました。\n' + (err.message || err));
            }
        });

    })();
    </script>
</body>
</html>
